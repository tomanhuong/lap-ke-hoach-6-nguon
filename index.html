<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GÂY ẢNH HƯỞNG</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg-gradient: linear-gradient(135deg, #1C1A4A 0%, #2B296D 50%, #151436 100%);
  --c1: rgba(255,255,255,0.03); 
  --c2: rgba(0,0,0,0.15); 
  --c3: rgba(255,255,255,0.05); 
  --b1: rgba(255,255,255,0.08); 
  --b2: rgba(255,255,255,0.15); 
  --t1: #e6edf3; 
  --t2: rgba(255,255,255,0.8);
  --t3: rgba(255,255,255,0.5); 
  --p:  #FFD400; 
  --pg: rgba(255, 212, 0, 0.15);
  --pa: rgba(255, 212, 0, 0.08);
  --ok: #00A79D; 
  --okg: rgba(0, 167, 157, 0.15);
  --wa: #FDB913; 
  --wag: rgba(253, 185, 19, 0.15);
  --er: #f85149; 
  --erg: rgba(248, 81, 73, 0.15);
  --r: 12px; 
  --rs: 8px; 
  --sit: env(safe-area-inset-top, 0px);
  --sib: env(safe-area-inset-bottom, 0px);
  --sil: env(safe-area-inset-left, 0px);
  --sir: env(safe-area-inset-right, 0px);
}

html, body {
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--t1);
  font-family: 'Crimson Text', Georgia, serif;
  font-size: 15.5px; 
  line-height: 1.6;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  position: fixed;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

#login-screen {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg-gradient);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 99999;
}
.login-box {
  background: rgba(255,255,255,0.03); border: 1px solid var(--b1); padding: 40px 30px;
  border-radius: var(--r); text-align: center; max-width: 90%; width: 380px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5); backdrop-filter: blur(15px);
}
.login-icon { font-size: 50px; margin-bottom: 20px; filter: drop-shadow(0 0 15px var(--p)); }
.login-title { font-family: 'Space Mono', monospace; font-size: 22px; color: var(--p); font-weight: bold; margin-bottom: 10px; letter-spacing: 1px;}
.login-desc { font-size: 14px; color: var(--t2); margin-bottom: 30px; font-style: italic;}
#password-input {
  width: 100%; padding: 14px; margin-bottom: 20px; border-radius: 8px;
  border: 1px solid var(--b2); background: rgba(0,0,0,0.3); color: white;
  font-size: 18px; font-family: 'Space Mono', monospace; text-align: center; letter-spacing: 4px;
}
#password-input:focus { border-color: var(--ok); outline: none; }
#btn-login {
  width: 100%; padding: 14px; border-radius: 8px; background: var(--ok); color: white;
  font-weight: bold; font-size: 15px; border: none; cursor: pointer; font-family: 'Space Mono', monospace; transition: all 0.2s;
}
#btn-login:hover { background: #008f86; transform: translateY(-2px); }
#login-error { color: var(--er); font-size: 13px; font-family: 'Space Mono', monospace; margin-top: 15px; display: none; }

#app {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: none; 
  flex-direction: column;
}

#hdr {
  display: flex; align-items: center; gap: 12px;
  background: rgba(255,255,255,0.02);
  border-bottom: 1px solid var(--b1);
  padding: calc(12px + var(--sit)) 16px 12px;
  flex-shrink: 0;
  backdrop-filter: blur(15px);
  z-index: 100;
}
.logo { font-family: 'Space Mono', monospace; font-size: 16px; font-weight: 700; color: var(--p); letter-spacing: 1px; flex-shrink: 0; }
.logo span { color: var(--ok); }

#proj-info {
  flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--b1); 
  border-radius: var(--rs); cursor: pointer; transition: all .15s;
}
#proj-info:hover { border-color: var(--p); background: rgba(255,212,0,0.05); }
#pname { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; font-weight: 600; color: var(--t1); font-family: 'Space Mono', monospace;}

.hbs { display: flex; gap: 8px; flex-shrink: 0; }
.hb { width: 36px; height: 36px; border-radius: var(--rs); border: 1px solid var(--b1); background: var(--ok); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; transition: all .2s; flex-shrink: 0; font-family: 'Space Mono', monospace; font-weight: bold;}
.hb:active { transform: scale(.92); background: #008f86; }

#syncbar { background: rgba(0,0,0,0.5); border-bottom: 1px solid var(--b1); flex-shrink: 0; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--p); max-height: 0; overflow: hidden; transition: max-height .3s, padding .3s; font-family: 'Space Mono', monospace;}
#syncbar.show { max-height: 30px; padding: 6px 16px; }
.sd { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.sd.ok { background: var(--ok); box-shadow: 0 0 5px var(--ok); }
.sd.er { background: var(--er); box-shadow: 0 0 5px var(--er); }
.sd.ld { background: var(--p); animation: blink 1s infinite; box-shadow: 0 0 5px var(--p); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

#main { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: 20px;}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--ok); border-radius: 3px; }

.view { display: none; padding: 16px; max-width: 850px; margin: 0 auto; width: 100%;}
.view.on { display: block; animation: fadeIn .3s ease forwards; }
@keyframes fadeIn { from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:translateY(0)} }

#bnav {
  background: rgba(43,41,109,0.95);
  border-top: 1px solid var(--b1);
  display: flex; flex-shrink: 0;
  backdrop-filter: blur(15px);
  padding-bottom: var(--sib);
  padding-left: var(--sil);
  padding-right: var(--sir);
}
.ntab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  padding: 12px 4px 10px; cursor: pointer; color: rgba(255,255,255,0.5);
  font-size: 10px; font-weight: bold; background: none; border: none; font-family: 'Space Mono', monospace;
  letter-spacing: .5px; transition: all .2s; position: relative; -webkit-tap-highlight-color: transparent;
  border-right: 1px solid rgba(255,255,255,0.05);
}
.ntab:last-child { border-right: none; }
.ntab em { font-size: 20px; font-style: normal; filter: grayscale(100%); transition: all .3s; }
.ntab.on { color: var(--p); }
.ntab.on em { filter: grayscale(0) drop-shadow(0 0 6px rgba(255,212,0,0.6)); transform: scale(1.1); }

.sl { font-family: 'Space Mono', monospace; font-size: 13px; font-weight: bold; color: var(--p); text-transform: none; letter-spacing: 1px; display: block; margin-bottom: 14px; }

.card, .th, .gr {
  background: var(--c1); border: 1px solid var(--b1); border-radius: var(--r);
  padding: 20px; margin-bottom: 16px; transition: all .2s;
}
.card:hover { background: rgba(255,255,255,0.06); border-color: rgba(0,167,157,0.5); }
.card.ok { border-left: 3px solid var(--ok); }
.card.wa { border-left: 3px solid var(--wa); }
.card.er { border-left: 3px solid var(--er); }
.card.n  { border-left: 3px solid var(--ok); }

.tm { font-size: 16px; font-weight: 600; color: #fff; line-height: 1.4; margin-bottom: 4px; font-family: 'Space Mono', monospace;}
.ts { font-size: 14px; color: var(--t2); font-style: italic;}
.mono { font-family: 'Space Mono', monospace; font-size: 14px; }
.tok{color:var(--ok)}.twa{color:var(--wa)}.ter{color:var(--er)}.tp{color:var(--p)}

.badge { display: inline-flex; align-items: center; border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: bold; font-family: 'Space Mono', monospace; white-space: nowrap; margin-right: 4px;}
.badge.ok { background: var(--okg); color: var(--ok); border: 1px solid var(--ok);}
.badge.wa { background: var(--wag); color: var(--wa); border: 1px solid var(--wa);}
.badge.er { background: var(--erg); color: var(--er); border: 1px solid var(--er);}
.badge.p  { background: var(--pg); color: var(--p); border: 1px solid var(--p);}
.badge.n  { background: var(--c2); color: var(--t2); border: 1px solid var(--b2);}

.pb { height: 6px; background: rgba(255,255,255,0.1); border-radius: 50px; overflow: hidden; margin-top: 10px; }
.pf { height: 100%; border-radius: 50px; transition: width .6s ease; }
.pf.ok { background: var(--ok); } .pf.wa { background: var(--wa); } .pf.er { background: var(--er); } .pf.p { background: var(--p); }

.th-d { font-size: 12px; color: var(--t3); margin-bottom: 4px; font-family: 'Space Mono', monospace;}
.th-s { font-size: 32px; font-weight: 700; font-family: 'Space Mono', monospace; margin-bottom: 3px; color: var(--p) !important; text-shadow: 0 0 10px var(--pg);}
.ths { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
@media (min-width: 600px) { .ths { grid-template-columns: repeat(4, 1fr); } }
.thi { background: var(--c2); padding: 12px; border-radius: var(--rs); text-align: center; border: 1px solid var(--b1);}
.thi .n { font-size: 22px; font-weight: 700; font-family: 'Space Mono', monospace; color: var(--wa); margin-bottom: 4px;}
.thi .l { font-size: 10px; color: var(--t3); text-transform: uppercase; letter-spacing: .5px; }

.ti, .wi { border-radius: var(--r); padding: 16px; margin-bottom: 12px; display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--b1); background: var(--c2); }
.ti.er, .wi.er { background: var(--erg); border-color: rgba(248,81,73,0.3); }
.ti.wa, .wi.wa { background: var(--wag); border-color: rgba(253, 185, 19,0.3); }
.wi.ok { background: var(--okg); border-color: rgba(0, 167, 157,0.3); }
.tia { font-size: 15px; font-weight: 600; color: var(--t1); margin-bottom: 4px; font-family: 'Space Mono', monospace;}
.tip { font-size: 13px; color: var(--t2); }
.wit { font-size: 14px; font-weight: bold; margin-bottom: 4px; color: var(--p); font-family: 'Space Mono', monospace;}
.wid { font-size: 13.5px; color: var(--t1); line-height: 1.5; }

.sg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.sb2 { background: rgba(0,0,0,0.2); border-radius: var(--rs); padding: 10px; border: 1px solid var(--b1);}
.sbl { font-size: 10px; color: var(--t3); font-family: 'Space Mono', monospace; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
.sbv { font-size: 15px; font-weight: 600; font-family: 'Space Mono', monospace; color: var(--t1);}

.d7s { display: flex; gap: 6px; margin-top: 10px; }
.d7 { flex: 1; height: 28px; border-radius: 6px; background: rgba(0,0,0,0.3); border: 1px solid var(--b1); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: var(--t3); font-family: 'Space Mono', monospace;}
.d7.on { background: var(--okg); border-color: var(--ok); color: var(--ok); box-shadow: 0 0 5px var(--okg);}

.abtn, .bp { 
  background: var(--ok); color: white; border: none; border-radius: 8px; padding: 12px 20px; 
  font-family: 'Space Mono', monospace; font-size: 14px; font-weight: bold; letter-spacing: .5px; 
  cursor: pointer; transition: all .2s; text-align: center;
}
.abtn:hover, .bp:hover { background: #008f86; transform: translateY(-2px); }
.abtn:active, .bp:active { transform: scale(0.95); }

.cibtn { 
  border-radius: 8px; border: 1px solid var(--ok); background: transparent; color: var(--ok); 
  font-family: 'Space Mono', monospace; font-size: 12px; font-weight: bold; padding: 8px 16px; 
  cursor: pointer; transition: all .2s; 
}
.cibtn.done { background: var(--ok); color: white; }
.cibtn:active { transform: scale(.95); }

.mb { 
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; 
  color: var(--p); font-family: 'Space Mono', monospace; font-size: 12px; font-weight: bold; 
  padding: 6px 12px; cursor: pointer; transition: all .2s; 
}
.mb.er { border-color: rgba(248,81,73,0.3); color: var(--er); background: rgba(248,81,73,0.1); }
.mb.p { border-color: rgba(255,212,0,0.3); color: var(--p); background: rgba(255,212,0,0.1); }
.mb:hover { background: rgba(255,255,255,0.1); }

.li, .fi { 
  width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); 
  border-radius: 8px; padding: 12px 14px; color: #fff; font-size: 15px; font-family: 'Crimson Text', serif; 
  outline: none; transition: border-color .2s; 
}
.li:focus, .fi:focus { border-color: var(--ok); background: rgba(0,0,0,0.3); }
select.fi option { background: #2B296D; color: #fff; }
.ls { background: var(--ok); color: white; border: none; border-radius: 8px; padding: 12px 20px; font-family: 'Space Mono', monospace; font-weight: bold; cursor: pointer; }

#mo, #cfm { 
  position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); 
  z-index: 9999; display: none; align-items: center; justify-content: center; 
  padding: 20px;
}
#mo.on, #cfm.on { display: flex; }
#mbox, #cfmb { 
  background: #2B296D; border: 1px solid var(--ok); border-radius: 16px; 
  width: 100%; max-width: 500px; max-height: 90dvh; display: flex; flex-direction: column; 
  box-shadow: 0 10px 40px rgba(0,0,0,0.8); animation: pop 0.3s ease; 
}
@keyframes pop { 0% {transform: scale(0.95); opacity: 0;} 100% {transform: scale(1); opacity: 1;} }

#mh { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--b1); }
#mt { font-family: 'Space Mono', monospace; font-size: 16px; font-weight: bold; color: var(--p); }
#mc { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--b1); background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s;}
#mc:hover { background: rgba(255,255,255,0.1); }
#mb { overflow-y: auto; padding: 20px; flex: 1; }
#mf { padding: 16px 20px; border-top: 1px solid var(--b1); display: flex; gap: 12px; }

.fl { display: block; font-size: 13px; font-weight: 600; color: var(--t1); margin-bottom: 6px; font-family: 'Space Mono', monospace;}
.fg { margin-bottom: 16px; }

#toasts { position: fixed; top: calc(env(safe-area-inset-top,0px) + 80px); left: 50%; transform: translateX(-50%); z-index: 10000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; width: 90%; max-width: 400px; }
.toast { background: #2B296D; border: 1px solid var(--ok); border-radius: 8px; padding: 12px 20px; font-size: 14px; font-family: 'Space Mono', monospace; font-weight: bold; color: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.5); animation: toastIn .3s ease forwards; }
.toast.er { border-color: var(--er); color: var(--er); }
.toast.wa { border-color: var(--wa); color: var(--wa); }

.row { display: flex; align-items: center; gap: 12px; }
.row.top { align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 4px; }
.f1 { flex: 1; min-width: 0; }
.ic { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.tog { background: rgba(255,255,255,0.05); border: 1px solid var(--b1); border-radius: 6px; color: var(--t1); cursor: pointer; font-size: 12px; padding: 6px 10px; transition: all .2s; }
.tog.open { transform: rotate(90deg); background: var(--p); color: #000; border-color: var(--p);}
.nested { margin-left: 0; margin-top: 16px; border-top: 1px dashed var(--b1); padding-top: 16px; display: none; }
.nested.show { display: block; animation: fadeIn .3s ease; }
.ni { padding: 12px; border-radius: var(--rs); background: rgba(0,0,0,0.2); margin-bottom: 8px; border: 1px solid var(--b1); }
.adr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.qcs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.qc { background: rgba(0,0,0,0.3); border: 1px solid var(--b2); border-radius: 6px; padding: 6px 12px; font-size: 13px; font-family: 'Space Mono', monospace; font-weight: bold; color: var(--t1); cursor: pointer; transition: all .2s; }
.qc:active, .qc:hover { background: var(--p); color: #000; border-color: var(--p); }
.srcg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
@media (min-width: 600px) { .srcg { grid-template-columns: repeat(6, 1fr); } }
.srb { border: 1px solid var(--b1); border-radius: var(--rs); padding: 12px 8px; text-align: center; cursor: pointer; background: rgba(0,0,0,0.2); transition: all .2s; }
.srb em { font-size: 24px; font-style: normal; display: block; margin-bottom: 4px; }
.srb span { font-size: 11px; color: var(--t2); font-weight: bold; font-family: 'Space Mono', monospace;}
.srb.on { background: var(--pg); border-color: var(--p); }
.strow { display: flex; gap: 10px; margin-top: 10px; }
.sb3 { flex: 1; background: rgba(0,0,0,0.2); border: 1px solid var(--b1); border-radius: var(--rs); padding: 12px 8px; text-align: center; }
.sb3n { font-size: 22px; font-weight: 700; font-family: 'Space Mono', monospace; color: var(--t1); }
.sb3l { font-size: 10px; color: var(--t3); text-transform: uppercase; letter-spacing: .5px; margin-top: 4px; font-family: 'Space Mono', monospace;}
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: var(--t3); text-align: center; gap: 12px; }
.empty .ei { font-size: 48px; opacity: .8; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));}
.empty h3 { font-size: 16px; font-weight: bold; color: var(--p); font-family: 'Space Mono', monospace;}
.empty p { font-size: 14px; line-height: 1.6; }
.bs { flex: 1; background: transparent; color: var(--t1); border: 1px solid rgba(255,255,255,0.4); border-radius: 8px; padding: 12px; font-family: 'Space Mono', monospace; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center;}
.bd { flex: 1; background: rgba(248,81,73,0.1); color: var(--er); border: 1px solid rgba(248,81,73,0.4); border-radius: 8px; padding: 12px; font-family: 'Space Mono', monospace; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center;}
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.ssr { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.so { border: 1px solid var(--b1); border-radius: 8px; padding: 10px 5px; text-align: center; cursor: pointer; font-size: 12px; font-weight: bold; font-family: 'Space Mono', monospace; color: var(--t3); background: rgba(0,0,0,0.2); transition: all .2s; }
.so.op { border-color: var(--wa); color: var(--wa); background: var(--wag); } .so.od { border-color: var(--ok); color: var(--ok); background: var(--okg); } .so.ob { border-color: var(--er); color: var(--er); background: var(--erg); }
.gap { display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; padding: 4px 10px; font-size: 13px; font-weight: bold; font-family: 'Space Mono', monospace; border: 1px solid; }
.gap.ok { background: var(--okg); color: var(--ok); border-color: var(--ok); }
.gap.on { background: var(--pg); color: var(--p); border-color: var(--p); }
.gap.wa { background: var(--wag); color: var(--wa); border-color: var(--wa); }
.gap.er { background: var(--erg); color: var(--er); border-color: var(--er); }
.gap.nd { background: rgba(0,0,0,0.3); color: var(--t3); border-color: var(--b1); }
.dbar-wrap { margin-top: 12px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;}
.dbar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.dbl { font-size: 11px; color: var(--t2); font-weight: bold; width: 70px; flex-shrink: 0; font-family: 'Space Mono', monospace;}
.db { flex: 1; height: 8px; background: rgba(255,255,255,0.1); border-radius: 50px; overflow: hidden; }
.dbf { height: 100%; border-radius: 50px; transition: width .6s; }
.dbp { font-size: 12px; font-family: 'Space Mono', monospace; font-weight: bold; width: 35px; text-align: right; flex-shrink: 0; }
</style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <div class="login-icon">🔒</div>
        <div class="login-title">GÂY ẢNH HƯỞNG</div>
        <div class="login-desc">Hệ thống quản trị mục tiêu và hành vi. Vui lòng nhập mật khẩu để truy cập.</div>
        <input type="password" id="password-input" placeholder="Nhập mật khẩu..." onkeypress="if(event.key === 'Enter') checkPassword()">
        <button id="btn-login" onclick="checkPassword()">MỞ KHÓA</button>

<script>
const SURL="https://script.google.com/macros/s/AKfycbyM98HOG_OvFiYfi3OP0kP9heffLToH5WAHI-eNYjlF-h27XjcX9PgisK4D6QEkYPJ24g/exec";

const APP_PASSWORD = "Phothac1@";
const AUTH_KEY = "gayanhhuong_auth";

function checkPassword() {
    const input = document.getElementById('password-input').value;
    if (input === APP_PASSWORD) {
        localStorage.setItem(AUTH_KEY, "true");
        initApp();
    } else {
        document.getElementById('login-error').style.display = 'block';
    }
}

function logoutApp() {
    localStorage.removeItem(AUTH_KEY);
    location.reload();
}

function initApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    lv(); upPB(); rToday();
    if(SURL) setTimeout(syncAll, 1500);
}

function backupJSON() {
    if(!db || !db.projects) { toast("Không có dữ liệu để sao lưu", "wa"); return; }
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
    const a = document.createElement('a');
    a.setAttribute("href", dataStr);
    a.setAttribute("download", "GayAnhHuong_Backup_" + td() + ".json");
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('Đã tải bản sao lưu thành công', 'ok');
}

function restoreJSON(event) {
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const imported = JSON.parse(e.target.result);
            if(imported && imported.projects && imported.goals && imported.behaviors) {
                db = Object.assign({projects:[],sections:[],goals:[],behaviors:[],actions:[],logs:[],checkins:[]}, imported);
                sv();
                rAll();
                pushAll(false); 
                toast('✅ Đã khôi phục dữ liệu!', 'ok');
            } else { throw new Error("Cấu trúc file không đúng"); }
        } catch(err) { 
            toast('Lỗi: File không đúng định dạng', 'er'); 
        }
    };
    reader.readAsText(file);
    event.target.value = ''; 
}

const SRC=[{id:1,e:'❤️',n:'ĐL Cá nhân',s:'Động lực CN'},{id:2,e:'🧠',n:'NL Cá nhân',s:'Năng lực CN'},{id:3,e:'👥',n:'ĐL Xã hội',s:'Động lực XH'},{id:4,e:'🤝',n:'NL Xã hội',s:'Năng lực XH'},{id:5,e:'🏆',n:'ĐL Cấu trúc',s:'Động lực CT'},{id:6,e:'🛠️',n:'NL Cấu trúc',s:'Năng lực CT'}];
const ST={pending:{l:'Đang làm',c:'wa'},done:{l:'Xong',c:'ok'},blocked:{l:'Bị chặn',c:'er'}};

let db={projects:[],sections:[],goals:[],behaviors:[],actions:[],logs:[],checkins:[]};
let S={pids:[],view:'today',asrc:0};
let MCB=null,MDel=null,CCB=null;

function initProjects() {
    if(!db.projects) db.projects = [];
    let activeProjects = db.projects.filter(p => p.status !== 'archived');
    if(activeProjects.length === 0) {
        const newP = {id: uid('p'), name: 'Dự án đầu tiên', desc: 'Mục đích của dự án này...', status: 'active', created: td()};
        db.projects.push(newP);
        activeProjects = [newP];
    }
    if(!S.pids) S.pids = [];
    S.pids = S.pids.filter(id => activeProjects.some(p => p.id === id));
    if (S.pids.length === 0 && activeProjects.length > 0) {
        S.pids = [activeProjects[0].id];
    }
}

function sv(){
    try{
        localStorage.setItem('ios4',JSON.stringify(db));
        localStorage.setItem('ios4s',JSON.stringify(S));
    }catch(e){}
}

function lv(){
    try{
        const d=localStorage.getItem('ios4')||localStorage.getItem('ios3');
        if(d){
            const p=JSON.parse(d);
            db=Object.assign({projects:[],sections:[],goals:[],behaviors:[],actions:[],logs:[],checkins:[]},p);
        }
        const s=localStorage.getItem('ios4s');
        if(s) {
            const parsedS = JSON.parse(s);
            Object.assign(S, parsedS);
            if(parsedS.pid && (!S.pids || !Array.isArray(S.pids))) {
                S.pids = [parsedS.pid];
                delete S.pid;
            }
        }
        if(!S.pids) S.pids = [];
        initProjects();
        sv();
    }catch(e){}
}

function uid(p){return p+'_'+Date.now()+'_'+Math.random().toString(36).substr(2,4)}
function vv(id){return(document.getElementById(id)?.value||'').trim()}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function td(){return new Date().toISOString().slice(0,10)}
function fd(d){if(!d)return'—';try{return new Date(d+'T00:00:00').toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'});}catch(e){return d}}
function dB(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}
function gCurr(gid){return db.logs.filter(l=>l.gid===gid).reduce((a,l)=>a+parseFloat(l.value||0),0)}
function gPct(gid){const g=db.goals.find(x=>x.id===gid);if(!g||!+g.target)return 0;return Math.min(100,Math.round(gCurr(gid)/+g.target*100));}

function pPct(pid){
    const gs=db.goals.filter(g=>g.pid===pid);
    if(!gs.length)return 0;
    let totalPct = gs.reduce((acc, g) => {
        let gw = parseFloat(g.weight) || 0;
        return acc + (gPct(g.id) * gw / 100);
    }, 0);
    return Math.min(100, Math.round(totalPct));
}

function calcProjectsPct(pids) {
    if (!pids || pids.length === 0) return 0;
    let sum = 0;
    pids.forEach(pid => sum += pPct(pid));
    return Math.round(sum / pids.length);
}

function tPct(g){if(!g.start_date||!g.deadline)return null;const tot=dB(g.start_date,g.deadline);if(tot<=0)return 100;return Math.max(0,Math.min(100,Math.round(dB(g.start_date,td())/tot*100)));}
function dL(g){if(!g.deadline)return null;return dB(td(),g.deadline)}
function gSt(g){const rp=gPct(g.id),tp=tPct(g);if(tp===null)return{t:'nd',l:'Chưa deadline',gap:0};const gap=rp-tp;if(rp>=100)return{t:'ok',l:'Hoàn thành ✓',gap};if(gap>=10)return{t:'ok',l:'Vượt +'+gap+'%',gap};if(gap>=-10)return{t:'on',l:'Đúng tiến độ',gap};if(gap>=-25)return{t:'wa',l:'Chậm '+gap+'%',gap};return{t:'er',l:'Nguy hiểm '+gap+'%',gap};}
function bTot(bid){return db.checkins.filter(c=>c.bid===bid).length}
function bTdy(bid){return db.checkins.some(c=>c.bid===bid&&c.date===td())}
function bStr(bid){const ds=[...new Set(db.checkins.filter(c=>c.bid===bid).map(c=>c.date))].sort().reverse();if(!ds.length)return 0;let s=0,cur=td();for(const d of ds){if(d===cur){s++;const dd=new Date(cur);dd.setDate(dd.getDate()-1);cur=dd.toISOString().slice(0,10);}else break;}return s;}
function bL7(bid){const out=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);out.push(d.toISOString().slice(0,10));}return out.map(d=>({date:d,done:db.checkins.some(c=>c.bid===bid&&c.date===d)}));}
function qVals(t2){const t=parseFloat(t2)||100;const s=t/10;const cands=[1,2,5,10,20,25,50,100,200,500,1000];const nr=cands.filter(x=>x>0&&x<=t&&x>=s*.5);return[...new Set([nr[0]||1,nr[1]||Math.round(t/4),Math.round(t/2)].filter(x=>x>0))].slice(0,4);}
function pc(p){return p>=70?'ok':p>=40?'wa':'er'}
function ssb(m,t){document.getElementById('sdot').className='sd '+t;document.getElementById('smsg').textContent=m;const b=document.getElementById('syncbar');b.classList.add('show');if(t==='ok'||t==='er')setTimeout(()=>b.classList.remove('show'),3000);}

let _pt=null;
function push(act,data){clearTimeout(_pt);_pt=setTimeout(()=>pushAll(true), 2500);}

async function syncAll(isManual = false){
    if(!SURL){if(isManual)toast('Chưa cài URL','wa');return;}
    ssb('Đang đồng bộ…','ld');
    try{
        const r=await fetch(SURL+'?action=getAll');
        const j=await r.json();
        if(j.status==='ok' && j.data){
            if(Object.keys(j.data).length === 0){pushAll(true);return;}
            const newDataStr = JSON.stringify(j.data);
            const oldDataStr = JSON.stringify(db);
            if (newDataStr !== oldDataStr) {
                db=Object.assign({projects:[],sections:[],goals:[],behaviors:[],actions:[],logs:[],checkins:[]},j.data);
                initProjects(); sv(); rAll(); 
            }
            ssb('Xong ✓','ok'); 
            if(isManual) toast('Tải từ Sheets thành công','ok');
        } else ssb('Lỗi dữ liệu','er');
    }catch(e){
        ssb('Lỗi mạng','er');
        if(isManual) toast('Không kết nối được','er');
    }
}

function pushAll(sl=false){
    if(!SURL){if(!sl)toast('Chưa cài URL','wa');return;}
    ssb('Đang lưu…','ld');
    fetch(SURL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'replace_all',data:db})})
    .then(r => r.json())
    .then(res => { ssb('Đã lưu ✓','ok'); if(!sl)toast('Đồng bộ lên Sheets xong','ok'); })
    .catch(e => { ssb('Lỗi kết nối','er'); });
}

async function addGoal(d){const g={id:uid('g'),pid:d.pid,sid:d.sid||'',name:d.name,target:parseFloat(d.target)||0,unit:d.unit||'',measure:d.measure||'',weight:parseFloat(d.weight)||0,start_date:d.start_date||td(),deadline:d.deadline||''};db.goals.push(g);sv();rAll();push('add_goal',g);}
async function updGoal(id,d){const g=db.goals.find(x=>x.id===id);if(!g)return;Object.assign(g,{pid:d.pid,name:d.name,target:parseFloat(d.target)||0,unit:d.unit||'',measure:d.measure||'',weight:parseFloat(d.weight)||0,start_date:d.start_date||'',deadline:d.deadline||''});sv();rAll();push('update_goal',g);}
async function delGoal(id){const bids=db.behaviors.filter(b=>b.gid===id).map(b=>b.id);db.goals=db.goals.filter(g=>g.id!==id);db.behaviors=db.behaviors.filter(b=>b.gid!==id);db.logs=db.logs.filter(l=>l.gid!==id);db.checkins=db.checkins.filter(c=>!bids.includes(c.bid));sv();rAll();push('delete_goal',{id});}
async function addBehavior(d){const b={id:uid('b'),pid:d.pid,gid:d.gid,name:d.name,desc:d.desc||''};db.behaviors.push(b);sv();rAll();push('add_behavior',b);}
async function updBehavior(id,d){const b=db.behaviors.find(x=>x.id===id);if(!b)return;Object.assign(b,d);sv();rAll();push('update_behavior',b);}
async function delBehavior(id){db.behaviors=db.behaviors.filter(b=>b.id!==id);db.actions=db.actions.filter(a=>a.bid!==id);db.checkins=db.checkins.filter(c=>c.bid!==id);sv();rAll();push('delete_behavior',{id});}
async function addAction(d){const a={id:uid('a'),pid:d.pid,bid:d.bid||'',name:d.name,source:+d.source||1,assignee:d.assignee||'',deadline:d.deadline||'',status:d.status||'pending',note:d.note||''};db.actions.push(a);sv();rActions();push('add_action',a);}
async function updAction(id,d){const a=db.actions.find(x=>x.id===id);if(!a)return;Object.assign(a,{pid:d.pid,bid:d.bid||a.bid,name:d.name,source:+d.source||1,assignee:d.assignee||'',deadline:d.deadline||'',status:d.status||'pending',note:d.note||''});sv();rActions();push('update_action',a);}
async function delAction(id){db.actions=db.actions.filter(a=>a.id!==id);sv();rActions();push('delete_action',{id});}
async function togSt(id){const a=db.actions.find(x=>x.id===id);if(!a)return;const cy={pending:'done',done:'blocked',blocked:'pending'};a.status=cy[a.status]||'pending';sv();rActions();rToday();push('update_action',a);}
async function addLog(gid,value,note=''){const l={id:uid('l'),gid,date:td(),value:parseFloat(value)||0,note};db.logs.push(l);sv();rAll();push('add_log',l);toast('+'+value+' đã ghi nhận','ok');}
async function delLog(id){db.logs=db.logs.filter(l=>l.id!==id);sv();rAll();push('delete_log',{id});}
async function doCI(bid){if(bTdy(bid)){const c=db.checkins.find(x=>x.bid===bid&&x.date===td());if(c){db.checkins=db.checkins.filter(x=>x.id!==c.id);sv();rBehav();rToday();push('delete_checkin',{id:c.id});toast('Đã bỏ check-in','wa');}}else{const c={id:uid('c'),bid,date:td()};db.checkins.push(c);sv();rBehav();rToday();push('add_checkin',c);toast('✓ Check-in!','ok');}}
async function sIL(gid,pfx){const inp=document.getElementById(pfx+gid);const val=parseFloat(inp?.value);if(!inp||isNaN(val)||val<=0){toast('Nhập giá trị hợp lệ','er');return;}inp.value='';await addLog(gid,val);}

function bWarn(pids){
    const gs=db.goals.filter(g=>pids.includes(g.pid));
    const bs=db.behaviors.filter(b=>pids.includes(b.pid));
    const as=db.actions.filter(a=>pids.includes(a.pid));
    const ws=[];
    gs.forEach(g=>{
        const pName = S.pids.length > 1 ? `[${db.projects.find(p=>p.id===g.pid)?.name}] ` : '';
        const st=gSt(g);const tp=tPct(g);const rp=gPct(g.id);const dl=dL(g);
        if(st.t==='er')ws.push({lv:'er',ic:'🚨',t:'Nguy hiểm: '+g.name,d:'Kết quả '+rp+'% vs thời gian '+tp+'%. Chậm '+Math.abs(st.gap)+'%.',tags:['🎯 '+pName+g.name],pri:10});
        else if(st.t==='wa')ws.push({lv:'wa',ic:'⚠️',t:'Chậm tiến độ: '+g.name,d:'Kết quả '+rp+'% vs thời gian '+tp+'%.',tags:['🎯 '+pName+g.name],pri:7});
        if(dl!==null&&dl>=0&&dl<=7&&rp<100)ws.push({lv:'er',ic:'⏰',t:'Deadline còn '+dl+' ngày: '+g.name,d:'Đạt '+rp+'% / '+g.target+' '+g.unit+'. Cần tăng tốc.',tags:['📅 '+fd(g.deadline)],pri:9});
        if(!g.deadline)ws.push({lv:'wa',ic:'📅',t:'Chưa đặt deadline: '+g.name,d:'Không có deadline → không đo tiến độ thời gian.',tags:['🎯 '+pName+g.name],pri:3});
        if(bs.filter(b=>b.gid===g.id).length===0)ws.push({lv:'wa',ic:'💡',t:'Không có hành vi: '+g.name,d:'Mục tiêu này chưa có hành vi then chốt gắn kết.',tags:['🎯 '+pName+g.name],pri:5});
    });
    bs.forEach(b=>{
        const g=db.goals.find(x=>x.id===b.gid);const bAs=as.filter(a=>a.bid===b.id);const l7=bL7(b.id).filter(x=>x.done).length;
        if(bAs.length===0)ws.push({lv:'wa',ic:'⚡',t:'Hành vi chưa có hành động: '+b.name,d:'Cần tạo ít nhất 1 hành động (6 nguồn).',tags:['💡 '+b.name,g?'🎯 '+g.name:''].filter(Boolean),pri:6});
        if(l7<=2&&bTot(b.id)>0)ws.push({lv:'wa',ic:'📉',t:'Hành vi không đều: '+b.name,d:'Chỉ '+l7+'/7 ngày qua. Ảnh hưởng kết quả.',tags:['💡 '+b.name,g?'🎯 '+g.name:''].filter(Boolean),pri:5});
    });
    as.filter(a=>a.status==='blocked').forEach(a=>{
        const src=SRC.find(s=>s.id===a.source)||SRC[0];const beh=db.behaviors.find(b=>b.id===a.bid);const goal=beh?db.goals.find(g=>g.id===beh.gid):null;
        ws.push({lv:'er',ic:'🚫',t:'Bị chặn: '+a.name,d:'Nguồn '+src.e+' '+src.s+' — '+(a.assignee||'chưa giao')+'.',tags:['⚡ '+src.s,beh?'💡 '+beh.name:'',goal?'🎯 '+goal.name:''].filter(Boolean),pri:8});
    });
    if (gs.length > 0) {
        SRC.forEach(src=>{
            if(as.filter(a=>a.source===src.id).length===0)ws.push({lv:'wa',ic:src.e,t:'Thiếu hành động Nguồn '+src.id+': '+src.s,d:'Mô hình 6 nguồn cần phủ đủ. Nguồn này đang bỏ trống.',tags:['⚡ Nguồn '+src.id],pri:4});
        });
    }
    return ws.sort((a,b)=>b.pri-a.pri);
}

function rAll(){upPB();rCurV();}
function rCurV(){if(S.view==='today')rToday();else if(S.view==='goals')rGoals();else if(S.view==='behav')rBehav();else if(S.view==='actions')rActions();else if(S.view==='analyze')rAnalyze();}

function upPB(){
    const pct = calcProjectsPct(S.pids);
    const el = document.getElementById('pname');
    if (S.pids.length === 0) {
        el.textContent = '— Vui lòng chọn dự án —';
    } else if (S.pids.length === 1) {
        const p = db.projects.find(x => x.id === S.pids[0]);
        el.textContent = p ? p.name + ' · Tiến độ: ' + pct + '%' : '—';
    } else {
        el.textContent = S.pids.length + ' dự án · Tiến độ chung: ' + pct + '%';
    }
}

function oProjSet() {
    const activeProjects = db.projects.filter(x => x.status !== 'archived');
    const archivedProjects = db.projects.filter(x => x.status === 'archived');

    let filterHtml = '<div class="sl" style="margin-top:0;margin-bottom:10px; font-size:12px; color:var(--t2)">👁️ BỘ LỌC HIỂN THỊ (Tích để xem)</div>' +
                     '<div style="max-height:180px;overflow-y:auto;border:1px solid var(--b1);border-radius:var(--rs);padding:10px;margin-bottom:20px; background: rgba(0,0,0,0.2);">';
    if(activeProjects.length === 0) {
        filterHtml += '<div style="color:var(--t3); font-size:12px; text-align:center; padding:10px">Chưa có dự án nào.</div>';
    } else {
        activeProjects.forEach(a => {
            const isSelected = S.pids.includes(a.id);
            filterHtml += `<div style="background:var(--c1);padding:10px 12px;border-radius:var(--rs);margin-bottom:8px;font-size:14px;display:flex;justify-content:space-between;align-items:center; border: 1px solid ${isSelected ? 'var(--p)' : 'var(--b1)'}; cursor:pointer; transition:all 0.2s" onclick="togglePid('${a.id}')">` +
                          `<div style="display:flex;align-items:center;gap:12px; overflow:hidden;">`+
                          `<div style="width:22px;height:22px;border-radius:6px;border:2px solid ${isSelected ? 'var(--p)' : 'var(--t3)'};background:${isSelected ? 'var(--p)' : 'transparent'};display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s">${isSelected ? '<span style="color:#000;font-weight:bold;font-size:14px">✓</span>' : ''}</div>` +
                          `<span style="color:${isSelected ? 'var(--p)' : 'var(--t1)'};font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(a.name)}</span>` +
                          `</div></div>`;
        });
    }
    filterHtml += '</div>';

function togglePid(id) {
    if (S.pids.includes(id)) { S.pids = S.pids.filter(x => x !== id); }
    else { S.pids.push(id); }
    sv(); rAll(); oProjSet(); 
}

function oEditProj(id) {
    const p = db.projects.find(x => x.id === id); if(!p) return;
    const body = '<div class="fg"><label class="fl">Tên dự án *</label><input class="fi" id="f-pname" value="' + esc(p.name) + '"></div>' +
                 '<div class="fg"><label class="fl">Mục đích / Ghi chú dự án</label><textarea class="fi" id="f-pdesc" rows="3" placeholder="Ghi chú mục đích dự án...">' + esc(p.desc||'') + '</textarea></div>';
    oMod('✏️ Sửa Dự Án', body, () => {
        const val = vv('f-pname');
        if(!val){ toast('Tên không được rỗng', 'er'); return false; }
        p.name = val; p.desc = vv('f-pdesc'); sv(); rAll(); toast('Đã lưu thay đổi', 'ok'); push('update_project', p);
        return true;
    });
    document.getElementById('mbcan').textContent = "Hủy";
}

function createP() {
    const body = '<div class="fg"><label class="fl">Tên dự án *</label><input class="fi" id="f-newpname" placeholder="VD: Triển khai chiến dịch Q3"></div>' +
                 '<div class="fg"><label class="fl">Mục đích / Ghi chú</label><textarea class="fi" id="f-newpdesc" rows="3" placeholder="Mục đích chính của dự án là gì?"></textarea></div>';
    oMod('✨ Tạo Dự Án Mới', body, () => {
        const name = vv('f-newpname');
        if(!name) { toast('Bạn cần nhập tên dự án', 'er'); return false; }
        const newP = {id: uid('p'), name: name, desc: vv('f-newpdesc'), status: 'active', created: td()};
        db.projects.push(newP);
        S.pids.push(newP.id);
        sv(); rAll(); push('add_project', newP); toast('Tạo dự án mới thành công', 'ok');
        return true;
    });
    document.getElementById('mbcan').textContent = "Hủy";
}

function archiveP(id){
    const p = db.projects.find(x => x.id === id);
    if(p) { p.status = 'archived'; p.archived_at = td(); }
    initProjects();
    sv(); rAll(); push('archive_project', p); toast('Đã đưa vào lưu trữ', 'wa');
    oProjSet(); 
}

function restoreP(id) {
    const p = db.projects.find(x => x.id === id);
    if(p) { p.status = 'active'; delete p.archived_at; S.pids.push(p.id); }
    sv(); rAll(); push('restore_project', p); toast('Đã khôi phục dự án', 'ok');
    oProjSet(); 
}

function oMod(title,body,saveCb,delCb){
    document.getElementById('mt').textContent=title;
    document.getElementById('mb').innerHTML=body;
    document.getElementById('mbdel').style.display=delCb?'block':'none';
    document.getElementById('mbok').style.display=saveCb?'block':'none';
    document.getElementById('mbcan').textContent="Hủy";
    document.getElementById('mo').classList.add('on');
    MCB=saveCb;MDel=delCb||null;
    setTimeout(()=>document.querySelector('#mb input,#mb select,#mb textarea')?.focus(),200);
}
function cMod(){document.getElementById('mo').classList.remove('on');MCB=null;MDel=null;}
function rSave(){if(MCB&&MCB()!==false)cMod();}
function rDel(){if(MDel){cMod();MDel();}}

function fGoal(g){
    const activeProjects = db.projects.filter(p => p.status !== 'archived');
    const defaultPid = S.pids.length > 0 ? S.pids[0] : (activeProjects[0]?.id || '');
    const pO = activeProjects.map(p => `<option value="${p.id}" ${(g?.pid || defaultPid) === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
    return '<div class="fg"><label class="fl">Thuộc dự án *</label><select class="fi" id="f-gpid">'+pO+'</select></div>'+
           '<div class="fg"><label class="fl">Tên mục tiêu (S) *</label><input class="fi" id="f-gname" value="'+esc(g?.name||'')+'" placeholder="Kết quả cụ thể cần đạt"></div>'+
           '<div class="frow"><div class="fg"><label class="fl">Giá trị (M)</label><input class="fi" id="f-gtarget" type="number" min="0" value="'+(g?.target||'')+'" placeholder="100"></div>'+
           '<div class="fg"><label class="fl">Đơn vị (M)</label><input class="fi" id="f-gunit" type="text" value="'+esc(g?.unit||'')+'" placeholder="VD: tỷ VNĐ"></div></div>'+
           '<div class="fg"><label class="fl">Cách đo (M)</label><input class="fi" id="f-gmeasure" type="text" value="'+esc(g?.measure||'')+'" placeholder="VD: Báo cáo CRM"></div>'+
           '<div class="fg"><label class="fl">Trọng số (%) (R)</label><input class="fi" id="f-gweight" type="number" min="0" value="'+(g?.weight||'')+'" placeholder="VD: 20"></div>'+
           '<div class="frow"><div class="fg"><label class="fl">Bắt đầu (T)</label><input class="fi" id="f-gsdate" type="date" value="'+(g?.start_date||td())+'"></div><div class="fg"><label class="fl">Deadline (T)</label><input class="fi" id="f-gdline" type="date" value="'+(g?.deadline||'')+'"></div></div>'+
           '<div style="background:var(--pg);border-radius:var(--rs);padding:10px 14px;font-size:12px;color:var(--p); font-family:\'Space Mono\',monospace; text-align:center;">S=Cụ thể · M=Đo được · A=Khả thi<br>R=Liên quan · T=Có hạn</div>';
}

function oAG(){oMod('🎯 Mục Tiêu SMART',fGoal(),()=>{const name=vv('f-gname');const pid=vv('f-gpid'); if(!name||!pid){toast('Cần điền Tên và chọn Dự án','er');return false;}addGoal({pid,name,target:vv('f-gtarget'),unit:vv('f-gunit'),measure:vv('f-gmeasure'),weight:vv('f-gweight'),start_date:vv('f-gsdate'),deadline:vv('f-gdline')});return true;});}
function oEG(id){const g=db.goals.find(x=>x.id===id);if(!g)return;oMod('✏️ Sửa Mục Tiêu',fGoal(g),()=>{const name=vv('f-gname');const pid=vv('f-gpid'); if(!name||!pid){toast('Cần điền Tên và chọn Dự án','er');return false;}updGoal(id,{pid,name,target:vv('f-gtarget'),unit:vv('f-gunit'),measure:vv('f-gmeasure'),weight:vv('f-gweight'),start_date:vv('f-gsdate'),deadline:vv('f-gdline')});return true;},()=>confDel(()=>delGoal(id),'Xóa mục tiêu này?'));}

function oAL(gid){
    const g=db.goals.find(x=>x.id===gid);if(!g)return;
    const qv=qVals(g.target);
    const body = '<div style="font-size:14px;color:var(--t2);margin-bottom:16px; font-family:\'Space Mono\',monospace">Hiện tại: <b class="tp">'+gCurr(gid)+' '+esc(g.unit)+'</b> / '+g.target+'</div>'+
                 '<div class="qcs">'+qv.map(x=>'<span class="qc" onclick="document.getElementById(\'f-lv\').value='+x+'">+'+x+'</span>').join('')+'</div>'+
                 '<div class="frow"><div class="fg"><label class="fl">Ngày</label><input class="fi" id="f-ld" type="date" value="'+td()+'"></div><div class="fg"><label class="fl">Giá trị (+)</label><input class="fi" id="f-lv" type="number" min="0" step="any" placeholder="0"></div></div>'+
                 '<div class="fg"><label class="fl">Ghi chú</label><input class="fi" id="f-lnote" type="text" placeholder="Ghi chú kết quả..." value=""></div>';
    oMod('📈 '+esc(g.name),body,()=>{const val=parseFloat(vv('f-lv'));if(isNaN(val)||val<0){toast('Giá trị không hợp lệ','er');return false;}addLog(gid,val,vv('f-lnote'));return true;});
}

function fBeh(b,dgid){
    const gs2=db.goals.filter(g=>S.pids.includes(g.pid));
    const gO=gs2.map(g=>{
        const p = db.projects.find(x=>x.id===g.pid);
        const pName = S.pids.length > 1 && p ? `[${p.name}] ` : '';
        return `<option value="${g.id}" ${((b?.gid||dgid)===g.id)?'selected':''}>${esc(pName + g.name)}</option>`;
    }).join('');
    return '<div class="fg"><label class="fl">Thuộc mục tiêu</label><select class="fi" id="f-bgid">'+( gO||'<option value="">— Chưa có mục tiêu nào trong dự án đang chọn —</option>')+'</select></div>'+
           '<div class="fg"><label class="fl">Tên hành vi *</label><input class="fi" id="f-bname" type="text" value="'+esc(b?.name||'')+'" placeholder="VD: Gọi điện KH hằng ngày"></div>'+
           '<div class="fg"><label class="fl">Mô tả / Tiêu chí</label><textarea class="fi" id="f-bdesc" rows="3" placeholder="Thực hiện đúng khi nào?">'+esc(b?.desc||'')+'</textarea></div>';
}
function oAB(gid){oMod('💡 Hành Vi Then Chốt',fBeh(null,gid),()=>{const name=vv('f-bname');if(!name){toast('Nhập tên hành vi','er');return false;} const goal = db.goals.find(g => g.id === vv('f-bgid')); const pid = goal ? goal.pid : (S.pids[0] || ''); addBehavior({pid, gid:vv('f-bgid'),name,desc:vv('f-bdesc')});return true;});}
function oEB(id){const b=db.behaviors.find(x=>x.id===id);if(!b)return;oMod('✏️ Sửa Hành Vi',fBeh(b,b.gid),()=>{const name=vv('f-bname');if(!name){toast('Nhập tên','er');return false;} const goal = db.goals.find(g => g.id === vv('f-bgid')); if(goal) b.pid = goal.pid; updBehavior(id,{gid:vv('f-bgid'),name,desc:vv('f-bdesc')});return true;},()=>confDel(()=>delBehavior(id),'Xóa hành vi?'));}

function fAct(a,dbid){
    const bs2=db.behaviors.filter(b=>S.pids.includes(b.pid));
    const bO=bs2.map(b=>{
        const p = db.projects.find(x=>x.id===b.pid);
        const pName = S.pids.length > 1 && p ? `[${p.name}] ` : '';
        return `<option value="${b.id}" ${((a?.bid||dbid)===b.id)?'selected':''}>${esc(pName + b.name)}</option>`;
    }).join('');
    const cs=a?.source||1;
    return '<div class="fg"><label class="fl">Hành vi liên quan</label><select class="fi" id="f-abid">'+( bO||'<option value="">— Chưa có hành vi nào trong dự án đang chọn —</option>')+'</select></div>'+
           '<div class="fg"><label class="fl">Tên hành động *</label><input class="fi" id="f-aname" value="'+esc(a?.name||'')+'" placeholder="VD: Đào tạo kỹ năng bán hàng"></div>'+
           '<div class="fg"><label class="fl">Nguồn ảnh hưởng *</label><input type="hidden" id="f-asrc" value="'+cs+'"><div class="srcg">'+SRC.map(s=>'<div class="srb '+(s.id===cs?'on':'')+'" style="'+(s.id===cs?'border-color:var(--p);background:var(--pg)':'')+';" onclick="sSrc(this,'+s.id+')"><em>'+s.e+'</em><span>'+s.n+'</span></div>').join('')+'</div></div>'+
           '<div class="frow"><div class="fg"><label class="fl">Giao cho ai</label><input class="fi" id="f-aassign" type="text" value="'+esc(a?.assignee||'')+'" placeholder="VD: Nguyễn Văn A"></div>'+
           '<div class="fg"><label class="fl">Deadline</label><input class="fi" id="f-adl" type="date" value="'+(a?.deadline||'')+'"></div></div>'+
           '<div class="fg"><label class="fl">Trạng thái</label><input type="hidden" id="f-asts" value="'+(a?.status||'pending')+'"><div class="ssr"><div class="so '+('pending'===(a?.status||'pending')?'op':'')+'" onclick="sSts(this,\'pending\')">⏳ Đang làm</div><div class="so '+('done'===a?.status?'od':'')+'" onclick="sSts(this,\'done\')">✅ Xong</div><div class="so '+('blocked'===a?.status?'ob':'')+'" onclick="sSts(this,\'blocked\')">🚫 Bị chặn</div></div></div>'+
           '<div class="fg"><label class="fl">Ghi chú</label><textarea class="fi" id="f-anote" rows="2" placeholder="Ghi chú thêm...">'+esc(a?.note||'')+'</textarea></div>';
}
function oAA(bid){oMod('⚡ Hành Động',fAct(null,bid),()=>{const name=vv('f-aname');if(!name){toast('Nhập tên hành động','er');return false;} const beh = db.behaviors.find(b => b.id === vv('f-abid')); const pid = beh ? beh.pid : (S.pids[0] || ''); addAction({pid, bid:vv('f-abid'),name,source:+document.getElementById('f-asrc').value||1,assignee:vv('f-aassign'),deadline:vv('f-adl'),status:document.getElementById('f-asts').value||'pending',note:vv('f-anote')});return true;});}
function oEA(id){const a=db.actions.find(x=>x.id===id);if(!a)return;oMod('✏️ Sửa Hành Động',fAct(a,a.bid),()=>{const name=vv('f-aname');if(!name){toast('Nhập tên','er');return false;} const beh = db.behaviors.find(b => b.id === vv('f-abid')); if(beh) a.pid = beh.pid; updAction(id,{bid:vv('f-abid'),name,source:+document.getElementById('f-asrc').value||1,assignee:vv('f-aassign'),deadline:vv('f-adl'),status:document.getElementById('f-asts').value||'pending',note:vv('f-anote')});return true;},()=>confDel(()=>delAction(id),'Xóa hành động?'));}

function sSrc(el,src){document.querySelectorAll('.srb').forEach(b=>{b.classList.remove('on');b.style.borderColor='';b.style.background='';});el.classList.add('on');el.style.borderColor='var(--p)';el.style.background='var(--pg)';document.getElementById('f-asrc').value=src;}
function sSts(el,st){document.querySelectorAll('.so').forEach(o=>o.className='so');el.classList.add('o'+st[0]);document.getElementById('f-asts').value=st;}

function togN(btn,id){const el=document.getElementById(id);if(!el)return;el.classList.toggle('show');btn.classList.toggle('open');}
function confDel(cb,msg){document.getElementById('cfmm').innerHTML='<b style="font-size:16px; color:var(--p); font-family:\'Space Mono\',monospace;">'+esc(msg||'Bạn chắc chắn?')+'</b><br><span style="font-size:13px;color:var(--t2); margin-top:8px; display:block;">Hành động này không thể hoàn tác.</span>';document.getElementById('cfm').classList.add('on');CCB=cb;}
function cCfm(){document.getElementById('cfm').classList.remove('on');CCB=null;}
function toast(msg,type){const t=document.createElement('div');t.className='toast '+(type||'ok');const ic={ok:'✓',er:'✕',wa:'⚠'};t.textContent=(ic[type||'ok']||'')+'  '+msg;document.getElementById('toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';},2300);setTimeout(()=>t.remove(),2700);}
function swV(vw){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.ntab').forEach(x=>x.classList.remove('on'));document.getElementById('v-'+vw)?.classList.add('on');document.querySelector('.ntab[data-v="'+vw+'"]')?.classList.add('on');S.view=vw;rCurV();document.getElementById('main').scrollTop=0;}

document.querySelectorAll('.ntab').forEach(b=>b.addEventListener('click',()=>swV(b.dataset.v)));
document.getElementById('mo').addEventListener('click',e=>{if(e.target===document.getElementById('mo'))cMod();});
document.getElementById('cfmy').addEventListener('click',()=>{if(CCB)CCB();cCfm();});

if (localStorage.getItem(AUTH_KEY) === "true") {
    initApp();
} else {
    document.getElementById('login-screen').style.display = 'flex';
}
</script>
</body>
</html>
