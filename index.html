<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>MÔ HÌNH 6 NGUỒN GÂY ẢNH HƯỞNG</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg-gradient: linear-gradient(135deg, #1C1A4A 0%, #2B296D 50%, #151436 100%);
  --c1: rgba(255,255,255,0.03); 
  --c2: rgba(0,0,0,0.15); 
  --c3: rgba(255,255,255,0.05); 
  --b1: rgba(255,255,255,0.08); 
  --b2: rgba(255,255,255,0.15); 
  --t1: #e6edf3; 
  --t2: rgba(255,255,255,0.8);
  --t3: rgba(255,255,255,0.5); 
  --p:  #FFD400; 
  --pg: rgba(255, 212, 0, 0.15);
  --pa: rgba(255, 212, 0, 0.08);
  --ok: #00A79D; 
  --okg: rgba(0, 167, 157, 0.15);
  --wa: #FDB913; 
  --wag: rgba(253, 185, 19, 0.15);
  --er: #f85149; 
  --erg: rgba(248, 81, 73, 0.15);
  --r: 12px; 
  --rs: 8px; 
  --sit: env(safe-area-inset-top, 0px);
  --sib: env(safe-area-inset-bottom, 0px);
  --sil: env(safe-area-inset-left, 0px);
  --sir: env(safe-area-inset-right, 0px);
}

html, body {
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--t1);
  font-family: 'Crimson Text', Georgia, serif;
  font-size: 15.5px; 
  line-height: 1.6;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  position: fixed;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

#login-screen {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg-gradient);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 99999;
}
.login-box {
  background: rgba(255,255,255,0.03); border: 1px solid var(--b1); padding: 40px 30px;
  border-radius: var(--r); text-align: center; max-width: 90%; width: 380px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5); backdrop-filter: blur(15px);
}
.login-icon { font-size: 50px; margin-bottom: 20px; filter: drop-shadow(0 0 15px var(--p)); }
.login-title { font-family: 'Space Mono', monospace; font-size: 22px; color: var(--p); font-weight: bold; margin-bottom: 10px; letter-spacing: 1px;}
.login-desc { font-size: 14px; color: var(--t2); margin-bottom: 30px; font-style: italic;}
#password-input {
  width: 100%; padding: 14px; margin-bottom: 20px; border-radius: 8px;
  border: 1px solid var(--b2); background: rgba(0,0,0,0.3); color: white;
  font-size: 18px; font-family: 'Space Mono', monospace; text-align: center; letter-spacing: 4px;
}
#password-input:focus { border-color: var(--ok); outline: none; }
#btn-login {
  width: 100%; padding: 14px; border-radius: 8px; background: var(--ok); color: white;
  font-weight: bold; font-size: 15px; border: none; cursor: pointer; font-family: 'Space Mono', monospace; transition: all 0.2s;
}
#btn-login:hover { background: #008f86; transform: translateY(-2px); }
#login-error { color: var(--er); font-size: 13px; font-family: 'Space Mono', monospace; margin-top: 15px; display: none; }

#app {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: none; 
  flex-direction: column;
}

#hdr {
  display: flex; align-items: center; gap: 12px;
  background: rgba(255,255,255,0.02);
  border-bottom: 1px solid var(--b1);
  padding: calc(12px + var(--sit)) 16px 12px;
  flex-shrink: 0;
  backdrop-filter: blur(15px);
  z-index: 100;
}
.logo { font-family: 'Space Mono', monospace; font-size: 16px; font-weight: 700; color: var(--p); letter-spacing: 1px; flex-shrink: 0; }
.logo span { color: var(--ok); }

#proj-info {
  flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--b1); 
  border-radius: var(--rs); cursor: pointer; transition: all .15s;
}
#proj-info:hover { border-color: var(--p); background: rgba(255,212,0,0.05); }
#pname { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; font-weight: 600; color: var(--t1); font-family: 'Space Mono', monospace;}

.hbs { display: flex; gap: 8px; flex-shrink: 0; }
.hb { width: 36px; height: 36px; border-radius: var(--rs); border: 1px solid var(--b1); background: var(--ok); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; transition: all .2s; flex-shrink: 0; font-family: 'Space Mono', monospace; font-weight: bold;}
.hb:active { transform: scale(.92); background: #008f86; }

#syncbar { background: rgba(0,0,0,0.5); border-bottom: 1px solid var(--b1); flex-shrink: 0; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--p); max-height: 0; overflow: hidden; transition: max-height .3s, padding .3s; font-family: 'Space Mono', monospace;}
#syncbar.show { max-height: 30px; padding: 6px 16px; }
.sd { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.sd.ok { background: var(--ok); box-shadow: 0 0 5px var(--ok); }
.sd.er { background: var(--er); box-shadow: 0 0 5px var(--er); }
.sd.ld { background: var(--p); animation: blink 1s infinite; box-shadow: 0 0 5px var(--p); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

#main { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: 20px;}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--ok); border-radius: 3px; }

.view { display: none; padding: 16px; max-width: 850px; margin: 0 auto; width: 100%;}
.view.on { display: block; animation: fadeIn .3s ease forwards; }
@keyframes fadeIn { from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:translateY(0)} }

#bnav {
  background: rgba(43,41,109,0.95);
  border-top: 1px solid var(--b1);
  display: flex; flex-shrink: 0;
  backdrop-filter: blur(15px);
  padding-bottom: var(--sib);
  padding-left: var(--sil);
  padding-right: var(--sir);
}
.ntab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  padding: 12px 4px 10px; cursor: pointer; color: rgba(255,255,255,0.5);
  font-size: 10px; font-weight: bold; background: none; border: none; font-family: 'Space Mono', monospace;
  letter-spacing: .5px; transition: all .2s; position: relative; -webkit-tap-highlight-color: transparent;
  border-right: 1px solid rgba(255,255,255,0.05);
}
.ntab:last-child { border-right: none; }
.ntab em { font-size: 20px; font-style: normal; filter: grayscale(100%); transition: all .3s; }
.ntab.on { color: var(--p); }
.ntab.on em { filter: grayscale(0) drop-shadow(0 0 6px rgba(255,212,0,0.6)); transform: scale(1.1); }

.sl { font-family: 'Space Mono', monospace; font-size: 13px; font-weight: bold; color: var(--p); text-transform: none; letter-spacing: 1px; display: block; margin-bottom: 14px; }

.card, .th, .gr {
  background: var(--c1); border: 1px solid var(--b1); border-radius: var(--r);
  padding: 20px; margin-bottom: 16px; transition: all .2s;
}
.card:hover { background: rgba(255,255,255,0.06); border-color: rgba(0,167,157,0.5); }
.card.ok { border-left: 3px solid var(--ok); }
.card.wa { border-left: 3px solid var(--wa); }
.card.er { border-left: 3px solid var(--er); }
.card.n  { border-left: 3px solid var(--ok); }

.tm { font-size: 16px; font-weight: 600; color: #fff; line-height: 1.4; margin-bottom: 4px; font-family: 'Space Mono', monospace;}
.ts { font-size: 14px; color: var(--t2); font-style: italic;}
.mono { font-family: 'Space Mono', monospace; font-size: 14px; }
.tok{color:var(--ok)}.twa{color:var(--wa)}.ter{color:var(--er)}.tp{color:var(--p)}

.badge { display: inline-flex; align-items: center; border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: bold; font-family: 'Space Mono', monospace; white-space: nowrap; margin-right: 4px;}
.badge.ok { background: var(--okg); color: var(--ok); border: 1px solid var(--ok);}
.badge.wa { background: var(--wag); color: var(--wa); border: 1px solid var(--wa);}
.badge.er { background: var(--erg); color: var(--er); border: 1px solid var(--er);}
.badge.p  { background: var(--pg); color: var(--p); border: 1px solid var(--p);}
.badge.n  { background: var(--c2); color: var(--t2); border: 1px solid var(--b2);}

.pb { height: 6px; background: rgba(255,255,255,0.1); border-radius: 50px; overflow: hidden; margin-top: 10px; }
.pf { height: 100%; border-radius: 50px; transition: width .6s ease; }
.pf.ok { background: var(--ok); } .pf.wa { background: var(--wa); } .pf.er { background: var(--er); } .pf.p { background: var(--p); }

.th-d { font-size: 12px; color: var(--t3); margin-bottom: 4px; font-family: 'Space Mono', monospace;}
.th-s { font-size: 32px; font-weight: 700; font-family: 'Space Mono', monospace; margin-bottom: 3px; color: var(--p) !important; text-shadow: 0 0 10px var(--pg);}
.ths { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
@media (min-width: 600px) { .ths { grid-template-columns: repeat(4, 1fr); } }
.thi { background: var(--c2); padding: 12px; border-radius: var(--rs); text-align: center; border: 1px solid var(--b1);}
.thi .n { font-size: 22px; font-weight: 700; font-family: 'Space Mono', monospace; color: var(--wa); margin-bottom: 4px;}
.thi .l { font-size: 10px; color: var(--t3); text-transform: uppercase; letter-spacing: .5px; }

.ti, .wi { border-radius: var(--r); padding: 16px; margin-bottom: 12px; display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--b1); background: var(--c2); }
.ti.er, .wi.er { background: var(--erg); border-color: rgba(248,81,73,0.3); }
.ti.wa, .wi.wa { background: var(--wag); border-color: rgba(253, 185, 19,0.3); }
.wi.ok { background: var(--okg); border-color: rgba(0, 167, 157,0.3); }
.tia { font-size: 15px; font-weight: 600; color: var(--t1); margin-bottom: 4px; font-family: 'Space Mono', monospace;}
.tip { font-size: 13px; color: var(--t2); }
.wit { font-size: 14px; font-weight: bold; margin-bottom: 4px; color: var(--p); font-family: 'Space Mono', monospace;}
.wid { font-size: 13.5px; color: var(--t1); line-height: 1.5; }

.sg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.sb2 { background: rgba(0,0,0,0.2); border-radius: var(--rs); padding: 10px; border: 1px solid var(--b1);}
.sbl { font-size: 10px; color: var(--t3); font-family: 'Space Mono', monospace; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
.sbv { font-size: 15px; font-weight: 600; font-family: 'Space Mono', monospace; color: var(--t1);}

.d7s { display: flex; gap: 6px; margin-top: 10px; }
.d7 { flex: 1; height: 28px; border-radius: 6px; background: rgba(0,0,0,0.3); border: 1px solid var(--b1); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: var(--t3); font-family: 'Space Mono', monospace;}
.d7.on { background: var(--okg); border-color: var(--ok); color: var(--ok); box-shadow: 0 0 5px var(--okg);}

.abtn, .bp { 
  background: var(--ok); color: white; border: none; border-radius: 8px; padding: 12px 20px; 
  font-family: 'Space Mono', monospace; font-size: 14px; font-weight: bold; letter-spacing: .5px; 
  cursor: pointer; transition: all .2s; text-align: center;
}
.abtn:hover, .bp:hover { background: #008f86; transform: translateY(-2px); }
.abtn:active, .bp:active { transform: scale(0.95); }

.cibtn { 
  border-radius: 8px; border: 1px solid var(--ok); background: transparent; color: var(--ok); 
  font-family: 'Space Mono', monospace; font-size: 12px; font-weight: bold; padding: 8px 16px; 
  cursor: pointer; transition: all .2s; 
}
.cibtn.done { background: var(--ok); color: white; }
.cibtn:active { transform: scale(.95); }

.mb { 
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; 
  color: var(--p); font-family: 'Space Mono', monospace; font-size: 12px; font-weight: bold; 
  padding: 6px 12px; cursor: pointer; transition: all .2s; 
}
.mb.er { border-color: rgba(248,81,73,0.3); color: var(--er); background: rgba(248,81,73,0.1); }
.mb.p { border-color: rgba(255,212,0,0.3); color: var(--p); background: rgba(255,212,0,0.1); }
.mb:hover { background: rgba(255,255,255,0.1); }

.li, .fi { 
  width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); 
  border-radius: 8px; padding: 12px 14px; color: #fff; font-size: 15px; font-family: 'Crimson Text', serif; 
  outline: none; transition: border-color .2s; 
}
.li:focus, .fi:focus { border-color: var(--ok); background: rgba(0,0,0,0.3); }
select.fi option { background: #2B296D; color: #fff; }
.ls { background: var(--ok); color: white; border: none; border-radius: 8px; padding: 12px 20px; font-family: 'Space Mono', monospace; font-weight: bold; cursor: pointer; }

#mo, #cfm { 
  position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); 
  z-index: 9999; display: none; align-items: center; justify-content: center; 
  padding: 20px;
}
#mo.on, #cfm.on { display: flex; }
#mbox, #cfmb { 
  background: #2B296D; border: 1px solid var(--ok); border-radius: 16px; 
  width: 100%; max-width: 500px; max-height: 90dvh; display: flex; flex-direction: column; 
  box-shadow: 0 10px 40px rgba(0,0,0,0.8); animation: pop 0.3s ease; 
}
@keyframes pop { 0% {transform: scale(0.95); opacity: 0;} 100% {transform: scale(1); opacity: 1;} }

#mh { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--b1); }
#mt { font-family: 'Space Mono', monospace; font-size: 16px; font-weight: bold; color: var(--p); }
#mc { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--b1); background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s;}
#mc:hover { background: rgba(255,255,255,0.1); }
#mb { overflow-y: auto; padding: 20px; flex: 1; }
#mf { padding: 16px 20px; border-top: 1px solid var(--b1); display: flex; gap: 12px; }

.fl { display: block; font-size: 13px; font-weight: 600; color: var(--t1); margin-bottom: 6px; font-family: 'Space Mono', monospace;}
.fg { margin-bottom: 16px; }

#toasts { position: fixed; top: calc(env(safe-area-inset-top,0px) + 80px); left: 50%; transform: translateX(-50%); z-index: 10000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; width: 90%; max-width: 400px; }
.toast { background: #2B296D; border: 1px solid var(--ok); border-radius: 8px; padding: 12px 20px; font-size: 14px; font-family: 'Space Mono', monospace; font-weight: bold; color: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.5); animation: toastIn .3s ease forwards; }
.toast.er { border-color: var(--er); color: var(--er); }
.toast.wa { border-color: var(--wa); color: var(--wa); }

.row { display: flex; align-items: center; gap: 12px; }
.row.top { align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 4px; }
.f1 { flex: 1; min-width: 0; }
.ic { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.tog { background: rgba(255,255,255,0.05); border: 1px solid var(--b1); border-radius: 6px; color: var(--t1); cursor: pointer; font-size: 12px; padding: 6px 10px; transition: all .2s; }
.tog.open { transform: rotate(90deg); background: var(--p); color: #000; border-color: var(--p);}
.nested { margin-left: 0; margin-top: 16px; border-top: 1px dashed var(--b1); padding-top: 16px; display: none; }
.nested.show { display: block; animation: fadeIn .3s ease; }
.ni { padding: 12px; border-radius: var(--rs); background: rgba(0,0,0,0.2); margin-bottom: 8px; border: 1px solid var(--b1); }
.adr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.qcs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.qc { background: rgba(0,0,0,0.3); border: 1px solid var(--b2); border-radius: 6px; padding: 6px 12px; font-size: 13px; font-family: 'Space Mono', monospace; font-weight: bold; color: var(--t1); cursor: pointer; transition: all .2s; }
.qc:active, .qc:hover { background: var(--p); color: #000; border-color: var(--p); }
.srcg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
@media (min-width: 600px) { .srcg { grid-template-columns: repeat(6, 1fr); } }
.srb { border: 1px solid var(--b1); border-radius: var(--rs); padding: 12px 8px; text-align: center; cursor: pointer; background: rgba(0,0,0,0.2); transition: all .2s; }
.srb em { font-size: 24px; font-style: normal; display: block; margin-bottom: 4px; }
.srb span { font-size: 11px; color: var(--t2); font-weight: bold; font-family: 'Space Mono', monospace;}
.srb.on { background: var(--pg); border-color: var(--p); }
.strow { display: flex; gap: 10px; margin-top: 10px; }
.sb3 { flex: 1; background: rgba(0,0,0,0.2); border: 1px solid var(--b1); border-radius: var(--rs); padding: 12px 8px; text-align: center; }
.sb3n { font-size: 22px; font-weight: 700; font-family: 'Space Mono', monospace; color: var(--t1); }
.sb3l { font-size: 10px; color: var(--t3); text-transform: uppercase; letter-spacing: .5px; margin-top: 4px; font-family: 'Space Mono', monospace;}
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: var(--t3); text-align: center; gap: 12px; }
.empty .ei { font-size: 48px; opacity: .8; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));}
.empty h3 { font-size: 16px; font-weight: bold; color: var(--p); font-family: 'Space Mono', monospace;}
.empty p { font-size: 14px; line-height: 1.6; }
.bs { flex: 1; background: transparent; color: var(--t1); border: 1px solid rgba(255,255,255,0.4); border-radius: 8px; padding: 12px; font-family: 'Space Mono', monospace; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center;}
.bd { flex: 1; background: rgba(248,81,73,0.1); color: var(--er); border: 1px solid rgba(248,81,73,0.4); border-radius: 8px; padding: 12px; font-family: 'Space Mono', monospace; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center;}
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.ssr { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.so { border: 1px solid var(--b1); border-radius: 8px; padding: 10px 5px; text-align: center; cursor: pointer; font-size: 12px; font-weight: bold; font-family: 'Space Mono', monospace; color: var(--t3); background: rgba(0,0,0,0.2); transition: all .2s; }
.so.op { border-color: var(--wa); color: var(--wa); background: var(--wag); } .so.od { border-color: var(--ok); color: var(--ok); background: var(--okg); } .so.ob { border-color: var(--er); color: var(--er); background: var(--erg); }
.gap { display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; padding: 4px 10px; font-size: 13px; font-weight: bold; font-family: 'Space Mono', monospace; border: 1px solid; }
.gap.ok { background: var(--okg); color: var(--ok); border-color: var(--ok); }
.gap.on { background: var(--pg); color: var(--p); border-color: var(--p); }
.gap.wa { background: var(--wag); color: var(--wa); border-color: var(--wa); }
.gap.er { background: var(--erg); color: var(--er); border-color: var(--er); }
.gap.nd { background: rgba(0,0,0,0.3); color: var(--t3); border-color: var(--b1); }
.dbar-wrap { margin-top: 12px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;}
.dbar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.dbl { font-size: 11px; color: var(--t2); font-weight: bold; width: 70px; flex-shrink: 0; font-family: 'Space Mono', monospace;}
.db { flex: 1; height: 8px; background: rgba(255,255,255,0.1); border-radius: 50px; overflow: hidden; }
.dbf { height: 100%; border-radius: 50px; transition: width .6s; }
.dbp { font-size: 12px; font-family: 'Space Mono', monospace; font-weight: bold; width: 35px; text-align: right; flex-shrink: 0; }
/* ===== Bổ sung cho bản 2 ===== */
.pf.on { background: var(--p); }
.pf.nd { background: var(--b2); }
@keyframes toastIn { from{opacity:0; transform:translateY(-8px)} to{opacity:1; transform:translateY(0)} }
#cfmb { padding: 22px 20px 18px; }
.cfmbs { display: flex; gap: 12px; margin-top: 18px; }
.cfmbs.col3 { flex-direction: column; }
.lr { display: flex; gap: 8px; align-items: stretch; margin-top: 4px; }
.lr .li { flex: 1; min-width: 0; }
.wig { font-size: 20px; line-height: 1.3; flex-shrink: 0; }

  <div class="hbs">

<script>
'use strict';
/* ============================================================
   MÔ HÌNH 6 NGUỒN GÂY ẢNH HƯỞNG — bản 2 (giao diện v2: Bảng OKR)
   O (dự án) → KR → KA → Hành động theo 6 nguồn
   Dữ liệu: lưu trên máy trước, gửi lên kho từng bản ghi qua hàng chờ.
   ============================================================ */

/* Dán địa chỉ /exec của Apps Script vào đây để khỏi nhập trên từng máy.
   Để trống thì app hỏi địa chỉ ở màn hình khóa. KHÔNG ghi mật khẩu vào file này. */
const API_URL = "https://script.google.com/macros/s/AKfycbzdKnaNhV8dagJz_JFg1Dp3T7CfsNVdpU5QgkJ40OOtdHhzpwc8UYejPM4q78jdImTqvQ/exec";

const SRC=[{id:1,e:'❤️',n:'ĐL Cá nhân',s:'Động lực cá nhân'},{id:2,e:'🧠',n:'NL Cá nhân',s:'Năng lực cá nhân'},{id:3,e:'👥',n:'ĐL Xã hội',s:'Động lực xã hội'},{id:4,e:'🤝',n:'NL Xã hội',s:'Năng lực xã hội'},{id:5,e:'🏆',n:'ĐL Cấu trúc',s:'Động lực cấu trúc'},{id:6,e:'🛠️',n:'NL Cấu trúc',s:'Năng lực cấu trúc'}];
const ST={pending:{l:'Đang làm',c:'wa'},done:{l:'Xong',c:'ok'},blocked:{l:'Bị chặn',c:'er'}};
const RH={daily:'Mỗi ngày',weekly:'Mỗi tuần',event:'Theo sự kiện',multi:'Nhiều lần mỗi ngày'};
const KK={sum:'Cộng dồn',list:'Tích theo danh sách',ka:'Lấy từ KA'};
const WD=['CN','T2','T3','T4','T5','T6','T7'];
const TYPES=['projects','goals','items','logs','behaviors','checkins','actions'];
const RVG='_tuan';                    // bản rà soát tuần được lưu chung trong bảng logs với gid này, để kho dữ liệu không phải đổi gì
const NUMF={goals:['target','weight'],items:['ord'],logs:['value'],behaviors:['quota'],actions:['source']};
const BOOLF={items:['done'],goals:['archived'],behaviors:['habit','archived']};
const DATEF={projects:['start_date','end_date','created','archived_at','closed_at'],goals:['start_date','deadline','archived_at'],behaviors:['archived_at','created','start_date'],items:['date'],logs:['date'],checkins:['date'],actions:['deadline']};

/* ---------------- tiện ích ---------------- */
const $=id=>document.getElementById(id);
const esc=s=>s==null?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const td=()=>iso(new Date());                       // ngày theo giờ của máy, không theo UTC
const pd=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||''));return m?new Date(+m[1],+m[2]-1,+m[3]):null;};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d);};
const dB=(a,b)=>{const x=pd(a),y=pd(b);return(x&&y)?Math.round((y-x)/864e5):null;};
const fd=s=>{const d=pd(s);return d?pad(d.getDate())+'/'+pad(d.getMonth()+1):'—';};
const weekStart=s=>{const d=pd(s);return addD(s,-((d.getDay()+6)%7));};   // tuần bắt đầu thứ Hai
const num=v=>{if(typeof v==='number')return isFinite(v)?v:0;const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0;};
const fmt=n=>String(Math.round(num(n)*100)/100).replace('.',',');
const truthy=v=>v===true||v===1||v==='1'||String(v).toUpperCase()==='TRUE';
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const vv=id=>(($(id)&&$(id).value)||'').trim();
const nowBuoi=()=>{const h=new Date().getHours();return h<11?0:h<17?1:2;};

function normDate(v){ if(!v) return ''; const s=String(v); if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s; const d=new Date(s); return isNaN(d)?'':iso(d); }
function normRec(type,r){
  if(!r||typeof r!=='object') return null;
  const id=String(r.id==null?'':r.id); if(!/^[\w-]{1,64}$/.test(id)) return null;
  const o={}; for(const k in r){ if(/^[\w]{1,40}$/.test(k)) o[k]=r[k]==null?'':r[k]; } o.id=id;
  (NUMF[type]||[]).forEach(k=>o[k]=num(o[k]));
  (BOOLF[type]||[]).forEach(k=>o[k]=truthy(o[k]));
  (DATEF[type]||[]).forEach(k=>o[k]=normDate(o[k]));
  for(const k in o){ if(typeof o[k]!=='number'&&typeof o[k]!=='boolean') o[k]=String(o[k]); }
  if(type==='projects'){ if(o.status!=='archived')o.status='active'; if(o.otype!=='commit')o.otype='aspire'; }
  if(type==='goals'){ if(!KK[o.kind])o.kind='sum'; if(o.link_mode!=='days')o.link_mode='count'; }
  if(type==='behaviors'){ if(!RH[o.rhythm])o.rhythm='daily'; o.quota=Math.max(1,Math.round(o.quota)||1); }
  if(type==='actions'){ o.source=Math.min(6,Math.max(1,Math.round(o.source)||1)); if(!ST[o.status])o.status='pending'; }
  if(type==='checkins'){ o.slot=o.slot==null?'':String(o.slot); }
  return o;
}
function normDB(d){ const out={}; TYPES.forEach(t=>{ out[t]=(Array.isArray(d&&d[t])?d[t]:[]).map(r=>normRec(t,r)).filter(Boolean); }); return out; }
const countDB=d=>TYPES.reduce((a,t)=>a+d[t].length,0);

/* ---------------- lưu trên máy ---------------- */
let lsWarned=false;
const LS={
  get(k,f){ try{ const v=localStorage.getItem(k); return v==null?f:JSON.parse(v); }catch(e){ return f; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ if(!lsWarned){ lsWarned=true; toast('Bộ nhớ trình duyệt đầy: thay đổi chưa lưu được trên máy này','er'); } return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const K={data:'gah2_data',out:'gah2_outbox',ui:'gah2_ui',pwd:'gah2_pwd',url:'gah2_url',local:'gah2_local'};

let DB=normDB({});
let OUT=[];                          // hàng chờ gửi lên kho, được lưu xuống máy
let SEQ=0;
let UI={pids:[],view:'today',asrc:0,asub:'ov',cal:'w',calOff:0};
let AUTH={pwd:'',url:API_URL,local:false,ro:false};   // ro: chế độ xem (ai có link đều xem được), sửa cần mật khẩu
const OPEN=new Set();                // các thẻ đang mở, giữ nguyên khi vẽ lại
let MCB=null,MDEL=null;

/* ---------------- ghi dữ liệu ---------------- */
function put(type,rec){ rec.updatedAt=new Date().toISOString(); const a=DB[type]; const i=a.findIndex(x=>x.id===rec.id); if(i>-1)a[i]=rec; else a.push(rec); enqueue({type,op:'upsert',id:rec.id,record:rec}); return rec; }
function del(type,id){ DB[type]=DB[type].filter(x=>x.id!==id); enqueue({type,op:'delete',id}); }
function enqueue(op){ SEQ++; if(AUTH.local) return; const i=OUT.findIndex(o=>!o.sent&&o.type===op.type&&o.id===op.id); if(i>-1)OUT.splice(i,1); op.k=SEQ; OUT.push(op); }
function saveOut(){ LS.set(K.out,OUT.map(o=>({k:o.k,type:o.type,op:o.op,id:o.id,record:o.record}))); }
function commit(){ LS.set(K.data,DB); saveOut(); LS.set(K.ui,UI); render(); flush(); }

/* ---------------- đồng bộ ---------------- */
let flushing=false,pulling=false,pullWanted=false,syncErr='',lastSync=0,retryT=null,retryN=0,renderPending=false;
async function api(body){
  const r=await fetch(AUTH.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({pwd:AUTH.pwd},body))});
  if(!r.ok) throw new Error('http_'+r.status);
  return r.json();
}
async function flush(){
  if(AUTH.local||flushing||!OUT.length) return;
  flushing=true; setSync();
  try{
    while(OUT.length){
      const batch=OUT.slice(0,40); batch.forEach(o=>o.sent=true);
      const res=await api({action:'ops',ops:batch.map(o=>({type:o.type,op:o.op,id:o.id,record:o.record}))});
      if(!res||!res.ok){ batch.forEach(o=>o.sent=false); if(res&&res.error==='unauthorized'){ relock('Mật khẩu không còn đúng. Thay đổi vẫn được giữ trên máy.'); return; } throw new Error((res&&res.error)||'server'); }
      const ks=new Set(batch.map(o=>o.k)); OUT=OUT.filter(o=>!ks.has(o.k)); saveOut(); retryN=0; lastSync=Date.now();
    }
    syncErr=''; repSoon();
  }catch(e){ OUT.forEach(o=>o.sent=false); syncErr='offline'; scheduleRetry(); }
  finally{ flushing=false; setSync(); if(!OUT.length&&pullWanted){ pullWanted=false; setTimeout(()=>pull(false),200); } }
}
function scheduleRetry(){ clearTimeout(retryT); const d=[5,15,45,120][Math.min(retryN,3)]*1000; retryN++; retryT=setTimeout(()=>{ if(OUT.length) flush(); },d); }
function isBusy(){ if($('mo').classList.contains('on')||$('cfm').classList.contains('on')) return true; const a=document.activeElement; return !!(a&&$('main').contains(a)&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')); }
async function pull(manual){
  if(AUTH.local){ if(manual) toast('Đang dùng trên máy này, chưa nối kho dữ liệu','wa'); return; }
  if(flushing||OUT.length){ pullWanted=true; flush(); if(manual) toast('Đang gửi thay đổi lên trước, rồi mới làm mới','ok'); return; }
  if(pulling) return;
  pulling=true; setSync(); const seq0=SEQ;
  try{
    const res=await api({action:'all'});
    if(!res||!res.ok){ if(res&&res.error==='unauthorized'){ relock('Mật khẩu không còn đúng.'); return; } throw new Error('server'); }
    if(SEQ!==seq0||OUT.length){ pullWanted=true; return; }          // có thay đổi trong lúc tải: bỏ bản vừa tải
    const fresh=normDB(res.data);
    if(AUTH.fromLocal){ AUTH.fromLocal=false; if(countDB(fresh)>0&&countDB(DB)>0){ syncErr=''; askMerge(fresh); return; } }   // vừa nối kho: hai bên đều có dữ liệu thì hỏi
    if(countDB(fresh)===0&&countDB(DB)>0){ syncErr=''; askEmptyStore(fresh); return; }
    DB=fresh; LS.set(K.data,DB); lastSync=Date.now(); syncErr=''; fixUI(); repDaily();
    if(isBusy()) renderPending=true; else render();
    if(manual) toast('Đã lấy dữ liệu mới nhất','ok');
  }catch(e){ syncErr='offline'; if(manual) toast('Không kết nối được kho dữ liệu','er'); }
  finally{ pulling=false; setSync(); if(pullWanted&&!OUT.length&&!flushing){ pullWanted=false; setTimeout(()=>pull(false),300); } }
}
function askEmptyStore(fresh){
  const n=countDB(DB);
  confirmBox('Kho dữ liệu đang trống, trên máy này còn '+n+' bản ghi.','Có thể kho vừa được tạo mới, hoặc dữ liệu trên kho đã bị xóa. App không tự xóa dữ liệu trên máy.',[
    {l:'Đưa dữ liệu trên máy lên kho',c:'bp',f:async()=>{ try{ const r=await api({action:'replace',data:DB}); if(r&&r.ok){ lastSync=Date.now(); toast('Đã đưa '+n+' bản ghi lên kho','ok'); } else toast('Kho từ chối: '+((r&&r.error)||'lỗi'),'er'); }catch(e){ toast('Không kết nối được kho dữ liệu','er'); } setSync(); }},
    {l:'Dùng kho trống, bỏ dữ liệu trên máy',c:'bd',f:()=>{ DB=fresh; LS.set(K.data,DB); fixUI(); render(); }},
    {l:'Để sau',c:'bs',f:()=>{}}
  ]);
}
function setSync(){
  const b=$('syn-btn'); if(!b) return;
  let t='☁',tip='Đã đồng bộ';
  if(AUTH.local){ t='⌂'; tip='Đang dùng trên máy này, chưa nối kho dữ liệu'; }
  else if(flushing||pulling){ t='⟳'; tip='Đang đồng bộ…'; }
  else if(OUT.length){ t='↑'+OUT.length; tip=OUT.length+' thay đổi chờ gửi'+(syncErr?' (đang mất kết nối, sẽ tự gửi lại)':''); }
  else if(syncErr){ t='⚠'; tip='Chưa kết nối được kho dữ liệu'; }
  b.textContent=t; b.title=tip; b.style.background=(OUT.length||syncErr)&&!AUTH.local?'var(--wa)':'';
  b.style.fontSize=t.length>2?'11px':'';
}
window.addEventListener('online',()=>{ if(OUT.length) flush(); else pull(false); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(OUT.length) flush(); else if(Date.now()-lastSync>20000) pull(false); } else if(OUT.length) flush(); });

/* ---------------- khóa ---------------- */
function showLock(msg){
  $('app').style.display='none'; $('login-screen').style.display='flex';
  $('url-input').style.display=API_URL?'none':'block'; if(!API_URL) $('url-input').value=AUTH.url||'';
  const e=$('login-error'); e.textContent=msg||''; e.style.display=msg?'block':'none';
}
function relock(msg){ AUTH.pwd=''; LS.del(K.pwd); if(AUTH.url&&$('app').style.display==='flex'){ AUTH.ro=true; toast(msg+' Chuyển sang chế độ xem.','wa'); render(); } else showLock(msg); }
async function unlock(){
  const url=API_URL||vv('url-input'), pwd=$('password-input').value, e=$('login-error'), btn=$('btn-login');
  const fail=m=>{ e.textContent=m; e.style.display='block'; };
  if(!/^https:\/\/\S+$/.test(url)) return fail('Cần địa chỉ kho dữ liệu, bắt đầu bằng https://');
  if(!pwd) return fail('Nhập mật khẩu.');
  btn.disabled=true; btn.textContent='ĐANG KIỂM TRA…';
  AUTH.url=url; AUTH.pwd=pwd;
  try{
    const r=await api({action:'ping'});
    if(r&&r.ok){ AUTH.local=false; AUTH.ro=false; LS.del(K.local); LS.set(K.url,url); LS.set(K.pwd,pwd); $('password-input').value=''; enterApp(); if(OUT.length) flush(); else pull(false); }
    else { AUTH.pwd=''; fail(r&&r.error==='no_password_set'?'Kho dữ liệu chưa đặt mật khẩu. Mở bảng tính, chọn menu Gây Ảnh Hưởng → Đặt mật khẩu.':'Mật khẩu không đúng.'); }
  }catch(err){ AUTH.pwd=''; fail('Không kết nối được kho dữ liệu. Kiểm tra địa chỉ và mạng.'); }
  btn.disabled=false; btn.textContent='MỞ KHÓA';
}
function useLocal(){ AUTH.local=true; LS.set(K.local,true); enterApp(); toast('Đang dùng trên máy này. Vào Phân Tích để nối kho dữ liệu sau','wa'); }
function logout(){
  if(!AUTH.local&&AUTH.url){ const go=()=>{ AUTH.pwd=''; LS.del(K.pwd); AUTH.ro=true; render(); toast('Máy này chỉ còn quyền xem','ok'); }; if(OUT.length) return confirmBox('Còn '+OUT.length+' thay đổi chưa gửi lên kho.','Gửi xong rồi hãy thôi quyền sửa, nếu không các thay đổi đó sẽ mất.',[{l:'Gửi lại ngay',c:'bp',f:()=>flush()},{l:'Không',c:'bs',f:()=>{}}]); return confirmBox('Thôi quyền sửa trên máy này?','Máy này vẫn xem được. Muốn sửa lại thì nhập mật khẩu.',[{l:'Thôi quyền sửa',c:'bd',f:go},{l:'Không',c:'bs',f:()=>{}}]); }
  const go=()=>{ LS.del(K.pwd); LS.del(K.data); LS.del(K.out); LS.del(K.local); location.reload(); };
  if(AUTH.local) return confirmBox('Khóa app và xóa dữ liệu trên máy này?','Bạn đang dùng chế độ chưa đồng bộ: dữ liệu chỉ có trên máy này. Hãy tải bản sao lưu trước.',[{l:'Xóa và khóa',c:'bd',f:go},{l:'Không',c:'bs',f:()=>{}}]);
  if(OUT.length) return confirmBox('Còn '+OUT.length+' thay đổi chưa gửi lên kho.','Đăng xuất bây giờ sẽ làm mất các thay đổi đó.',[{l:'Gửi lại ngay',c:'bp',f:()=>flush()},{l:'Vẫn đăng xuất',c:'bd',f:go},{l:'Không',c:'bs',f:()=>{}}]);
  confirmBox('Đăng xuất khỏi máy này?','Dữ liệu trên kho vẫn còn; bản lưu trên máy này sẽ bị xóa.',[{l:'Đăng xuất',c:'bd',f:go},{l:'Không',c:'bs',f:()=>{}}]);
}
function enterApp(){ $('login-screen').style.display='none'; $('app').style.display='flex'; document.body.classList.toggle('ro',!!AUTH.ro); fixUI(); swV(UI.view,true); setSync(); }
function boot(){
  DB=normDB(LS.get(K.data,{})); OUT=(LS.get(K.out,[])||[]).filter(o=>o&&o.type&&o.id); OUT.forEach(o=>{ SEQ=Math.max(SEQ,o.k||0); });

const B=id=>DB.behaviors.find(x=>x.id===id);

const bLive=b=>!b.archived&&!(G(b.gid)&&G(b.gid).archived);      // KA ẩn khi chính nó hoặc KR cha được lưu trữ

/* ---------------- KA: nhịp ---------------- */
const restSet=b=>new Set(String(b.rest||'').split(',').map(s=>s.trim()).filter(s=>s!=='').map(Number));
const isRest=(b,d)=>restSet(b).has(pd(d).getDay());
const slotsOf=b=>{const s=String(b.slots||'').split(',').map(x=>x.trim()).filter(Boolean);return s.length>=2?s.slice(0,4):['Sáng','Trưa','Tối'];};
const cisOf=bid=>DB.checkins.filter(c=>c.bid===bid);
const dayCis=(b,d)=>DB.checkins.filter(c=>c.bid===b.id&&c.date===d);
const slotDone=(b,d,i)=>DB.checkins.some(c=>c.bid===b.id&&c.date===d&&String(c.slot)===String(i));
function daySlots(b,d){ const n=slotsOf(b).length; let k=0; for(let i=0;i<n;i++) if(slotDone(b,d,i)) k++; return k; }
function dayDone(b,d){ return b.rhythm==='multi'?daySlots(b,d)>=slotsOf(b).length:dayCis(b,d).length>0; }
function weekCount(b,d){ const w=weekStart(d),e=addD(w,6); return DB.checkins.filter(c=>c.bid===b.id&&c.date>=w&&c.date<=e).length; }
function fullDays(b){ const ds=new Set(cisOf(b.id).map(c=>c.date)); let n=0; ds.forEach(d=>{ if(dayDone(b,d)) n++; }); return n; }
function firstDate(b){ let m=''; cisOf(b.id).forEach(c=>{ if(!m||c.date<m) m=c.date; }); return m; }
/* Chuỗi của KA làm hằng ngày: đếm số ngày đã làm; chuỗi chỉ đứt khi bỏ liên tiếp quá STREAK_GAP ngày.
   Ngày nghỉ đã đặt của KA không tính là bỏ. Hôm nay chưa ghi thì còn chờ, chưa tính là bỏ. KA theo tuần: đếm số tuần đạt liền. */
const STREAK_GAP=2;
function streakInfo(b){
  const t=td(),f=firstDate(b),o={n:0,miss:0,risk:false}; if(!f||b.rhythm==='event') return o;
  if(b.rhythm==='weekly'){ let w=weekStart(t); if(weekCount(b,w)>=b.quota) o.n++; w=addD(w,-7); while(w>=weekStart(f)){ if(weekCount(b,w)>=b.quota){ o.n++; w=addD(w,-7); } else break; } return o; }
  let d=dayDone(b,t)?t:addD(t,-1),miss=0,lead=true;
  while(d>=f){ if(dayDone(b,d)){ o.n++; miss=0; lead=false; } else if(!isRest(b,d)){ miss++; if(lead) o.miss=miss; if(miss>STREAK_GAP){ if(lead) o.n=0; break; } } d=addD(d,-1); }
  if(o.miss>STREAK_GAP) o.n=0;
  o.risk=o.n>0&&!dayDone(b,t)&&!isRest(b,t)&&o.miss===STREAK_GAP;      // hôm nay không làm là đứt chuỗi
  return o;
}
const streak=b=>streakInfo(b).n;
function buDay(b){   // ngày cần làm gần nhất trước hôm nay (bỏ qua ngày nghỉ); trả về ngày đó nếu chưa làm, để tích bù
  if(b.habit||(b.rhythm!=='daily'&&b.rhythm!=='multi')) return ''; const s=kaStart(b); let d=addD(td(),-1);
  for(let i=0;i<7&&isRest(b,d);i++) d=addD(d,-1);
  return s&&s<=d&&!isRest(b,d)&&!dayDone(b,d)?d:'';
}
const missedYesterday=b=>!!buDay(b);
function dueToday(b){ const t=td(); if(b.habit||kaLater(b)) return false; if(b.rhythm==='event') return false; if(b.rhythm==='weekly') return weekCount(b,t)<b.quota; return !isRest(b,t)&&!dayDone(b,t); }
function rate7(b){   // tỷ lệ giữ nhịp 7 ngày vừa qua (không tính hôm nay)
  const t=td(),f=kaStart(b); if(b.rhythm==='event'||!f||!firstDate(b)) return null;   // tính từ ngày bắt đầu của KA, như lịch
  if(b.rhythm==='weekly'){ const w=addD(weekStart(t),-7); return f>addD(w,6)?null:Math.min(1,weekCount(b,w)/b.quota); }
  let due=0,done=0; for(let i=1;i<=7;i++){ const d=addD(t,-i); if(d<f||isRest(b,d)) continue; due++; if(dayDone(b,d)) done++; } return due?done/due:null;
}
function kaAdh(b){   // tỷ lệ giữ nhịp từ ngày bắt đầu của KA đến nay, như lịch; ngày hoặc tuần đang dở không bị tính là thiếu
  const f=kaStart(b),t=td(); if(!firstDate(b)||!f||b.rhythm==='event') return null;
  if(b.rhythm==='weekly'){ let w=weekStart(f),done=0,due=0; const cw=weekStart(t); while(w<cw){ done+=Math.min(b.quota,weekCount(b,w)); due+=b.quota; w=addD(w,7); } const c=Math.min(b.quota,weekCount(b,cw)); done+=c; due+=c; return due?done/due:null; }
  let d=f,done=0,due=0; while(d<=t){ if(dayDone(b,d)){ done++; due++; } else if(d<t&&!isRest(b,d)) due++; d=addD(d,1); } return due?done/due:null;
}
function last7(b){ const t=td(), out=[]; for(let i=6;i>=0;i--){ const d=addD(t,-i); const n=dayCis(b,d).length; let c=''; if(b.rhythm==='multi'){ const k=daySlots(b,d); c=k>=slotsOf(b).length?'on':k>0?'pt':''; } else c=n>0?'on':''; if(!c&&isRest(b,d)&&b.rhythm!=='weekly'&&b.rhythm!=='event') c='rs'; out.push({d,c,n}); } return out; }

/* ---------------- KR: kết quả ---------------- */
function gCur(g){
  if(g.kind==='list') return DB.items.filter(i=>i.gid===g.id&&i.done).length;
  if(g.kind==='ka'){ const b=B(g.link_bid); if(!b) return 0; return g.link_mode==='days'?fullDays(b):cisOf(b.id).length; }
  return Math.round(DB.logs.filter(l=>l.gid===g.id).reduce((a,l)=>a+num(l.value),0)*1e6)/1e6;
}
function gTarget(g){ if(g.kind==='list'&&!(g.target>0)) return DB.items.filter(i=>i.gid===g.id).length; return g.target; }
function gScore(g){ const t=gTarget(g); return t>0?Math.max(0,Math.min(1,gCur(g)/t)):0; }
const gPct=g=>Math.round(gScore(g)*100);
const oThr=p=>(p&&p.otype==='commit')?1:0.7;
const thrL=p=>(p&&p.otype==='commit')?'1,0':'0,7';
/* Chấm nhanh hay chậm: so tiến độ kết quả (đạt ÷ đích) với tiến độ thời gian (ngày đã qua ÷ tổng số ngày của kỳ).
   Tốc độ = kết quả ÷ thời gian; 1,0 là đúng nhịp. Chênh dưới PACE.tol điểm % thì vẫn coi là đúng tiến độ, để đầu kỳ không báo oan. */
const PACE={fast:1.1,slow:0.9,bad:0.7,tol:3,tolBad:5};
const gStart=g=>g.start_date||((P(g.pid)||{}).start_date||'');      // KR không có ngày riêng thì theo ngày của O
const gEnd=g=>g.deadline||((P(g.pid)||{}).end_date||'');
function tRaw(g){ const s=gStart(g),e=gEnd(g); if(!s||!e) return null; const tot=dB(s,e); if(tot===null) return null; if(tot<=0) return td()>=e?100:0; return Math.max(0,Math.min(100,dB(s,td())/tot*100)); }
function tPct(g){ const t=tRaw(g); return t===null?null:Math.round(t); }
function dL(g){ const e=gEnd(g); return e?dB(td(),e):null; }
function pace(r,t){   // r: % kết quả, t: % thời gian đã qua
  const gap=r-t,n=Math.abs(Math.round(r)-Math.round(t)),o={rp:r,tp:t,gap,spd:t>0?r/t:null};
  if(t<=0) return Object.assign(o,r>=PACE.tol?{t:'ok',l:'Nhanh '+n+'%'}:{t:'on',l:'Mới bắt đầu'});
  if(o.spd>=PACE.fast&&gap>=PACE.tol) return Object.assign(o,{t:'ok',l:'Nhanh '+n+'%'});
  if(o.spd<PACE.bad&&gap<=-PACE.tolBad) return Object.assign(o,{t:'er',l:'Chậm nhiều '+n+'%'});
  if(o.spd<PACE.slow&&gap<=-PACE.tol) return Object.assign(o,{t:'wa',l:'Chậm '+n+'%'});
  return Object.assign(o,{t:'on',l:'Đúng tiến độ'});
}
function gSt(g){
  const t=tRaw(g),dl=dL(g);
  if(gPct(g)>=100) return {t:'ok',l:'Hoàn thành'};
  if(dl!==null&&dl<0) return {t:'er',l:'Quá hạn '+(-dl)+' ngày'};
  if(t===null) return {t:'nd',l:gEnd(g)?'Chưa có ngày bắt đầu':'Chưa có hạn'};
  if(gStart(g)>td()) return {t:'nd',l:'Chưa đến kỳ'};
  return pace(gScore(g)*100,t);
}
function oPace(pid){   // O: gộp các KR theo trọng số; mỗi KR tính thời gian theo kỳ riêng của nó
  const gs=liveGoals(pid).filter(g=>tRaw(g)!==null),W=gs.reduce((a,g)=>a+(g.weight>0?g.weight:0),0),w=g=>W>0?(g.weight>0?g.weight:0):1,S=gs.reduce((a,g)=>a+w(g),0); if(!S) return null;
  return {r:gs.reduce((a,g)=>a+gScore(g)*100*w(g),0)/S,t:gs.reduce((a,g)=>a+tRaw(g)*w(g),0)/S};
}
function oSt(pid){
  const p=P(pid),gs=liveGoals(pid); if(!p) return {t:'nd',l:''};
  if(isClosed(p)) return {t:'nd',l:'Đã chốt'};
  if(!gs.length) return {t:'nd',l:'Chưa có KR'};
  if(gs.every(g=>gPct(g)>=100)) return {t:'ok',l:'Hoàn thành'};
  const x=oPace(pid); if(!x) return {t:'nd',l:'Chưa có hạn'};
  if(p.end_date&&p.end_date<td()) return Object.assign(pace(x.r,x.t),{t:'er',l:'Hết chu kỳ '+dB(p.end_date,td())+' ngày'});
  return pace(x.r,x.t);
}
function needLine(g){   // mỗi tuần cần thêm bao nhiêu để kịp hạn
  const dl=dL(g),tg=gTarget(g),cur=gCur(g),s=gStart(g),e=gEnd(g),t=td(),r1=x=>fmt(Math.round(x*10)/10); if(dl===null||dl<0||!(tg>0)||cur>=tg) return '';
  const rem=tg-cur,span=s&&s>t?dB(s,e):dl,el=s&&s<t?dB(s,t):0,u=g.unit?' '+g.unit:'';
  return 'Để kịp hạn: còn '+fmt(rem)+u+', cần '+(span>=7?r1(rem/(span/7))+u+' mỗi tuần':fmt(rem)+u+(span<=0?' trong hôm nay':' trong '+(span+1)+' ngày còn lại'))+(el>=7?' (đến nay '+r1(cur/(el/7))+' mỗi tuần)':'')+'.';
}
function pPct(pid){ const gs=liveGoals(pid); if(!gs.length) return null; const W=gs.reduce((a,g)=>a+(g.weight>0?g.weight:0),0); if(W>0) return Math.round(gs.reduce((a,g)=>a+gPct(g)*(g.weight>0?g.weight:0),0)/W); return Math.round(gs.reduce((a,g)=>a+gPct(g),0)/gs.length); }
function allPct(){ const xs=UI.pids.map(pPct).filter(x=>x!==null); return xs.length?Math.round(xs.reduce((a,b)=>a+b,0)/xs.length):null; }
function overall(){ const gs=selGoals(); if(!gs.length) return {c:'nd',l:'Chưa có KR'}; const st=gs.map(gSt); if(st.some(s=>s.t==='er')) return {c:'er',l:'Có KR cần xử lý ngay'}; if(st.some(s=>s.t==='wa')) return {c:'wa',l:'Có KR đang chậm'}; return {c:'ok',l:'Đúng kế hoạch'}; }

/* ---------------- 6 nguồn: độ phủ ---------------- */
function cover(b){ const as=DB.actions.filter(a=>a.bid===b.id); return SRC.map(s=>{ const x=as.filter(a=>a.source===s.id); return {s,n:x.length,blk:x.filter(a=>a.status==='blocked').length,done:x.filter(a=>a.status==='done').length}; }); }
function coverHint(b){ const c=cover(b); const e=c.filter(x=>x.n===0).map(x=>x.s.id), k=c.filter(x=>x.blk>0).map(x=>x.s.id); const p=[]; if(e.length)p.push('trống nguồn '+e.join(', ')); if(k.length)p.push('bị chặn nguồn '+k.join(', ')); return p.join('; '); }
function coverStrip(b){ return '<div class="cvs">'+cover(b).map(x=>'<div class="cv '+(x.n===0?'':x.blk?'b':'f')+'" data-a="addAct" data-id="'+esc(b.id)+'" data-v="'+x.s.id+'" title="'+esc(x.s.s)+(x.n?': '+x.n+' hành động':': chưa có hành động')+'"><em>'+x.s.e+'</em>'+(x.n===0?'trống':x.blk?x.blk+' chặn':x.done+'/'+x.n)+'</div>').join('')+'</div>'; }

/* ---------------- cảnh báo, mỗi cảnh báo chỉ về nguồn cần bổ sung ---------------- */
function warns(){
  const open=pid=>!isClosed(P(pid)),gs=selGoals().filter(g=>open(g.pid)),bs=selBehs().filter(b=>open(bPid(b))),as=selActs().filter(a=>open(aPid(a))),ws=[],t=td(),multi=UI.pids.length>1;
  UI.pids.forEach(pid=>{ const p=P(pid); if(p&&p.end_date&&p.end_date<t&&!isClosed(p)) ws.push({lv:'wa',ic:'🏁',t:'O đã hết chu kỳ '+dB(p.end_date,t)+' ngày: '+p.name,d:'Chốt chu kỳ: tự chấm điểm từng KR, ghi câu chuyện sau con số và bài học.',pri:11,pid:p.id}); });
  const pn=pid=>multi&&P(pid)?'['+P(pid).name+'] ':'';
  gs.forEach(g=>{
    const st=gSt(g),rp=gPct(g),dl=dL(g),kas=bs.filter(b=>b.gid===g.id);
    const hint=kas.map(b=>{const h=coverHint(b);return h?'KA «'+b.name+'»: '+h:'';}).filter(Boolean).join(' · ');
    if(st.t==='er'||st.t==='wa') ws.push({lv:st.t,ic:st.t==='er'?'🚨':'⚠️',t:st.l+': '+pn(g.pid)+g.name,d:'Đạt '+rp+'%'+(tPct(g)!==null?' khi thời gian đã qua '+tPct(g)+'%':'')+(st.spd?', tốc độ '+fmt(st.spd):'')+'.'+(hint?' Xem lại nguồn — '+hint+'.':kas.length?' Các KA đã đủ 6 nguồn: xem lại nhịp làm KA.':''),pri:st.t==='er'?10:7,gid:g.id});
    if(dl!==null&&dl>=0&&dl<=7&&rp<100) ws.push({lv:'wa',ic:'⏰',t:'Còn '+dl+' ngày: '+pn(g.pid)+g.name,d:'Đạt '+fmt(gCur(g))+' / '+fmt(gTarget(g))+' '+g.unit+'.',pri:9,gid:g.id});
    if(!gEnd(g)) ws.push({lv:'wa',ic:'📅',t:'KR chưa có hạn: '+pn(g.pid)+g.name,d:'Không có hạn thì không so được kết quả với thời gian.',pri:3,gid:g.id});
    else if(!gStart(g)) ws.push({lv:'wa',ic:'📅',t:'KR chưa có ngày bắt đầu: '+pn(g.pid)+g.name,d:'Thiếu ngày bắt đầu thì không tính được thời gian đã qua. Đặt ngày cho KR hoặc cho O.',pri:3,gid:g.id});
    if(!kas.length) ws.push({lv:'wa',ic:'💡',t:'KR chưa có KA: '+pn(g.pid)+g.name,d:'Chọn hành vi then chốt kéo KR này đi.',pri:5,gid:g.id});
    if(g.kind==='ka'&&!B(g.link_bid)) ws.push({lv:'wa',ic:'🔗',t:'KR chưa nối với KA: '+pn(g.pid)+g.name,d:'KR này lấy số từ KA nhưng chưa chọn KA nào.',pri:6,gid:g.id});
    if(g.kind!=='list'&&!(g.target>0)) ws.push({lv:'wa',ic:'🎯',t:'KR chưa có đích: '+pn(g.pid)+g.name,d:'Chưa có con số đích nên chưa tính được tiến độ.',pri:6,gid:g.id});
  });
  bs.forEach(b=>{
    if(b.habit) return;
    const c=cover(b),empty=c.filter(x=>x.n===0),r=rate7(b);
    if(empty.length===6) ws.push({lv:'wa',ic:'✝️',t:'KA chưa có hành động nào: '+b.name,d:'Lập hành động theo 6 nguồn để đỡ hành vi này.',pri:6,bid:b.id});
    else if(empty.length) ws.push({lv:'wa',ic:'🧩',t:'KA còn trống '+empty.length+' nguồn: '+b.name,d:'Chưa có hành động ở: '+empty.map(x=>x.s.id+' '+x.s.s).join(', ')+'.',pri:4,bid:b.id});
    if(r!==null&&r<0.5&&cisOf(b.id).length>0) ws.push({lv:'wa',ic:'📉',t:'KA tụt nhịp: '+b.name,d:(b.rhythm==='weekly'?'Tuần trước đạt ':'7 ngày qua giữ ')+Math.round(r*100)+'% nhịp.'+(coverHint(b)?' Xem lại nguồn — '+coverHint(b)+'.':''),pri:6,bid:b.id});
  });
  as.forEach(a=>{
    const s=SRC[a.source-1],b=B(a.bid);
    if(a.status==='blocked') ws.push({lv:'er',ic:'🚫',t:'Bị chặn: '+a.name,d:'Nguồn '+s.id+' '+s.s+(b?' · KA «'+b.name+'»':'')+(a.assignee?' · '+a.assignee:'')+'.',pri:8,aid:a.id});
    else if(a.status!=='done'&&a.deadline&&a.deadline<t) ws.push({late:true,lv:'wa',ic:'⌛',t:'Hành động quá hạn '+dB(a.deadline,t)+' ngày: '+a.name,d:'Nguồn '+s.id+' '+s.s+(b?' · KA «'+b.name+'»':'')+'.',pri:7,aid:a.id});
  });
  return ws.sort((x,y)=>y.pri-x.pri);
}

/* ---------------- theo tuần: số liệu cho rà soát tuần ---------------- */
const reviews=()=>DB.logs.filter(l=>l.gid===RVG&&/^\d{4}-\d{2}-\d{2}$/.test(l.date)).sort((a,b)=>b.date.localeCompare(a.date));
const reviewOf=ws=>DB.logs.find(l=>l.gid===RVG&&l.date===ws);
const wkLabel=ws=>fd(ws)+' – '+fd(addD(ws,6));
function dueWeek(){ const t=td(),cw=weekStart(t),dow=pd(t).getDay(); if(dow===5||dow===6||dow===0) return cw; const pw=addD(cw,-7); return reviewOf(pw)?cw:pw; }   // thứ Sáu đến Chủ nhật: tuần này; đầu tuần: tuần trước nếu chưa rà soát
/* Ngày bắt đầu của KA: một mốc duy nhất cho mọi phép đếm (lịch, giữ nhịp %, rà soát tuần, tích bù, cảnh báo).
   = ngày bắt đầu anh đặt cho KA, nếu chưa đặt thì ngày tạo KA; nếu đã có lần tích sớm hơn thì lấy lần tích đó. */
function kaStart(b){ const f=firstDate(b),c=b.start_date||b.created||''; return c&&f?(c<f?c:f):(c||f); }
const kaStartWhy=b=>{ const f=firstDate(b),s=kaStart(b); return !s?'':s===f&&!(b.start_date===s||b.created===s)?'lần tích đầu tiên':b.start_date?'ngày bắt đầu đã đặt':'ngày tạo KA'; };
const kaLater=b=>{ const s=kaStart(b); return !!s&&s>td(); };   // KA chưa tới ngày bắt đầu
function kaWeek(b,ws){   // việc làm KA trong một tuần; due=null với KA theo sự kiện; hôm nay chưa ghi thì chưa tính là thiếu
  const we=addD(ws,6),t=td(),last=we<t?we:t,s=kaStart(b);
  if(b.rhythm==='event') return {done:DB.checkins.filter(c=>c.bid===b.id&&c.date>=ws&&c.date<=we).length,due:null};
  if(s&&s>we) return {done:0,due:0};
  if(b.rhythm==='weekly') return {done:Math.min(b.quota,weekCount(b,ws)),due:b.quota};
  let done=0,due=0; for(let d=s&&s>ws?s:ws;d<=last;d=addD(d,1)){ if(dayDone(b,d)){ done++; due++; } else if(d<t&&!isRest(b,d)) due++; }
  return {done,due};
}
function krWeek(g,ws){   // KR nhích bao nhiêu trong tuần
  const we=addD(ws,6),inW=d=>d>=ws&&d<=we;
  if(g.kind==='list') return DB.items.filter(i=>i.gid===g.id&&i.done&&inW(i.date)).length;
  if(g.kind==='ka'){ const b=B(g.link_bid); if(!b) return 0; if(g.link_mode==='days'){ let n=0; for(let i=0;i<7;i++) if(dayDone(b,addD(ws,i))) n++; return n; } return DB.checkins.filter(c=>c.bid===b.id&&inW(c.date)).length; }
  return Math.round(DB.logs.filter(l=>l.gid===g.id&&inW(l.date)).reduce((a,l)=>a+num(l.value),0)*1e6)/1e6;
}
const runPs=()=>DB.projects.filter(p=>p.status!=='archived'&&!p.closed_at);       // O đang chạy và chưa chốt
const liveP=pid=>{const p=P(pid);return !!p&&p.status!=='archived'&&!p.closed_at;};
const allGoals=()=>DB.goals.filter(g=>!g.archived&&liveP(g.pid));
const allBehs=()=>DB.behaviors.filter(b=>bLive(b)&&liveP(bPid(b)));
function totPct(){ const xs=runPs().map(p=>pPct(p.id)).filter(x=>x!==null); return xs.length?Math.round(xs.reduce((a,c)=>a+c,0)/xs.length):null; }
function weekSum(ws){
  let done=0,due=0; allBehs().filter(b=>!b.habit).forEach(b=>{ const k=kaWeek(b,ws); if(k.due){ done+=k.done; due+=k.due; } });
  const gs=allGoals(); return {done,due,rate:due?done/due:null,krs:gs.length,moved:gs.filter(g=>krWeek(g,ws)>0).length,blk:DB.actions.filter(a=>aLive(a)&&liveP(aPid(a))&&a.status==='blocked').length,pct:totPct()};
}

const sc01=v=>{ const s=String(v==null?'':v).trim(); return s===''?null:Math.max(0,Math.min(1,num(s))); };
const r2=x=>Math.round(x*100)/100;
const isClosed=p=>!!(p&&p.closed_at);
function oScore(pid,pick){   // điểm của O: trung bình điểm KR theo trọng số, cùng cách tính với % của O
  const gs=liveGoals(pid); if(!gs.length) return null; const f=g=>{ const v=pick?pick(g):null; return v===null||v===undefined?gScore(g):v; };
  const W=gs.reduce((a,g)=>a+(g.weight>0?g.weight:0),0);
  return W>0?gs.reduce((a,g)=>a+f(g)*(g.weight>0?g.weight:0),0)/W:gs.reduce((a,g)=>a+f(g),0)/gs.length;
}
const oFinal=p=>sc01(p&&p.final_score);
const passed=(p,sc)=>sc!==null&&r2(sc)>=oThr(p);

}
function calCell(b,d,t,s){

/* ---------- đọc file .xlsx (tự giải nén, không cần thư viện ngoài) ---------- */
async function readXlsx(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf),dec=new TextDecoder();
  let eo=-1; for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){ if(dv.getUint32(i,true)===0x06054b50){ eo=i; break; } }
  if(eo<0) throw new Error('not_xlsx');
  const n=dv.getUint16(eo+10,true),files={}; let p=dv.getUint32(eo+16,true);
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50) throw new Error('not_xlsx');
    const nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);
    files[dec.decode(u8.subarray(p+46,p+46+nl))]={m:dv.getUint16(p+10,true),cs:dv.getUint32(p+20,true),off:dv.getUint32(p+42,true)};
    p+=46+nl+xl+cl;
  }
  const get=async name=>{ const f=files[name]; if(!f) return null; const s=f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true),data=u8.subarray(s,s+f.cs);
    if(f.m===0) return dec.decode(data); if(f.m!==8) throw new Error('zip_method');
    return dec.decode(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()); };
  const xml=s=>new DOMParser().parseFromString(s,'application/xml'),txt=el=>[...el.getElementsByTagName('t')].map(t=>t.textContent).join('');
  const wb=await get('xl/workbook.xml'); if(!wb) throw new Error('not_xlsx');
  const rels={},rx=await get('xl/_rels/workbook.xml.rels'); if(rx) [...xml(rx).getElementsByTagName('Relationship')].forEach(r=>{ rels[r.getAttribute('Id')]=r.getAttribute('Target'); });
  const ssx=await get('xl/sharedStrings.xml'),ss=ssx?[...xml(ssx).getElementsByTagName('si')].map(txt):[];
  const col=ref=>{ let c=0; for(const ch of ref.replace(/\d+/g,'')) c=c*26+ch.charCodeAt(0)-64; return c-1; };
  const out=[];
  for(const sh of [...xml(wb).getElementsByTagName('sheet')]){
    let t=rels[sh.getAttribute('r:id')]||''; if(!t) continue; t=t.startsWith('/')?t.slice(1):'xl/'+t.replace(/^\.\//,'');
    const sx=await get(t); if(!sx) continue; const rows=[];
    [...xml(sx).getElementsByTagName('row')].forEach(r=>{ const ri=+r.getAttribute('r')-1,row=[];
      [...r.getElementsByTagName('c')].forEach(c=>{ const ty=c.getAttribute('t'),v=c.getElementsByTagName('v')[0]; let val='';
        if(ty==='s') val=v?ss[+v.textContent]||'':''; else if(ty==='inlineStr') val=txt(c); else if(ty==='b') val=v&&v.textContent==='1'?'TRUE':'FALSE'; else val=v?v.textContent:'';
        if(/^-?\d+\.0+$/.test(val)) val=val.replace(/\.0+$/,'');
        row[col(c.getAttribute('r'))]=val; });
      rows[ri]=[...row].map(x=>x==null?'':x); });
    out.push({name:sh.getAttribute('name')||'',rows:[...rows].map(x=>x||[])});
  }
  return out;
}
/* bảng dán từ Excel (tách bằng Tab) hoặc file CSV; ô có xuống dòng nằm trong ngoặc kép */
function parseDelim(t,d){
  const rows=[]; let row=[],cell='',q=false; t=String(t||'').replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; continue; }
    if(c==='"'&&cell==='') q=true; else if(c===d){ row.push(cell); cell=''; } else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; } else cell+=c; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
const guessDelim=t=>{ const l=String(t||'').split(/\r?\n/).slice(0,5).join('\n'); return (l.match(/\t/g)||[]).length?'\t':(l.match(/;/g)||[]).length>(l.match(/,/g)||[]).length?';':','; };

/* ---------- nhận cột theo tiêu đề ---------- */
const nrm=s=>String(s==null?'':s).toLowerCase().replace(/đ/g,'d').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const HDR=[['ma ka','kacode'],['hanh vi then chot','kacode'],['ma','code'],['noi dung','name'],['muc tieu va ket qua then chot','name'],['hanh dong','name'],['ten nguon','source'],['ten','name'],['thoi diem do','when'],['thoi diem','at'],['tan suat','freq'],['gop','group'],['thoi gian','time'],['y nghia','why'],['chi so','metric'],['cach do','measure'],['thanh cong','success'],['dich','success'],['don vi','unit'],['nguoi do','confirmer'],['nguoi xac nhan','confirmer'],['nguoi lien quan','assignee'],['nguoi','assignee'],['nguon luc','resource'],['nguon anh huong','source'],['nguon 1 6','source'],['nguon','src?'],['han','deadline'],['bat dau','start'],['ket thuc','end'],['trang thai','status'],['ghi chu','note'],['kieu do','kind'],['nhip','rhythm'],['loai','otype'],['vai tro','role'],['chu ky','cycle']];
const hdrField=h=>{ h=nrm(h); if(!h) return ''; const x=HDR.find(k=>h===k[0]||h.startsWith(k[0]+' ')); return x?x[1]:''; };
const cellv=v=>{ const s=String(v==null?'':v).replace(/ /g,' ').trim(); return /^[—–\-]+$/.test(s)?'':s; };
function codeLv(c){ c=String(c||'').replace(/\s+/g,'').toUpperCase().replace(/^HĐ/,'HD'); let m;
  if((m=/^O(\d+)$/.exec(c))) return {lv:'O',code:'O'+m[1],n:[m[1]]};
  if((m=/^KR(\d+)\.(\d+)$/.exec(c))) return {lv:'KR',code:'KR'+m[1]+'.'+m[2],n:[m[1],m[2]]};
  if((m=/^KA(\d+)\.(\d+)\.(\d+)$/.exec(c))) return {lv:'KA',code:'KA'+m[1]+'.'+m[2]+'.'+m[3],n:[m[1],m[2],m[3]]};
  if((m=/^HD(\d+)\.(\d+)\.(\d+)\.(\d+)$/.exec(c))) return {lv:'HD',code:'HĐ'+m[1]+'.'+m[2]+'.'+m[3]+'.'+m[4],n:[m[1],m[2],m[3],m[4]]};
  return null; }

/* ---------- đọc ngày, đích, nhịp ---------- */
const serialDate=n=>{ const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*864e5); return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()); };
const isSerial=s=>/^\d{5}(\.\d+)?$/.test(String(s))&&+s>30000&&+s<80000;
const vnd=s=>{ const d=pd(s); return d?pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear():''; };
function oneDate(s,y){   // "31/12", "31/12/2026", "2026-12-31", số ngày của Excel
  s=String(s||'').trim(); let m; if(!s) return '';
  if(isSerial(s)) return serialDate(+s);
  if((m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))) return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m=/^(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?$/.exec(s))){ const yy=m[3]?(m[3].length===2?'20'+m[3]:m[3]):String(y); const d=pad(+m[1]),mo=pad(+m[2]); if(+mo<1||+mo>12||+d<1||+d>31) return ''; return yy+'-'+mo+'-'+d; }
  return '';
}
function dateRange(s,y){   // "1/10–31/12/2026", "13/10–31/12", "Tháng 12", "Tháng 12/2026"
  s=String(s||'').replace(/\s+/g,' ').trim(); if(!s) return null; let m;
  if((m=/^th[áa]ng (\d{1,2})(?:[\/.](\d{4}))?$/i.exec(s))){ const yy=+(m[2]||y),mo=+m[1]; if(mo<1||mo>12) return null; return {s:yy+'-'+pad(mo)+'-01',e:iso(new Date(yy,mo,0))}; }
  const parts=s.split(/\s*[–—-]\s*|\s+đến\s+/); if(parts.length!==2) return null;
  const ye=(/(\d{4})$/.exec(parts[1])||[])[1]||(/(\d{4})$/.exec(parts[0])||[])[1]||y;
  const e=oneDate(parts[1],ye); let st=oneDate(parts[0],ye); if(!e||!st) return null;
  if(st>e&&!/\d{4}$/.test(parts[0])) st=oneDate(parts[0],+ye-1);
  return {s:st,e};
}
const cycleOf=(s,e)=>{ if(!s||!e) return ''; const a=pd(s),b=pd(e),q=d=>Math.floor(d.getMonth()/3)+1; return a.getFullYear()===b.getFullYear()&&q(a)===q(b)?'Quý '+q(a)+'/'+a.getFullYear():''; };
function unitFromMetric(m){ m=String(m||'').trim(); if(!/^số\s/i.test(m)) return ''; return m.replace(/^số\s+/i,'').split(/\s+(?:có|đã|được|đủ|trên|≥|≤|>|<)\s*|[,;(]/)[0].trim(); }
function parseTarget(raw,metric){   // trả {target,unit,t:'ok'|'warn'|'miss',m}
  const orig=String(raw||'').trim(),s=orig.replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim(),mu=unitFromMetric(metric); let m;
  if(!s) return {target:'',unit:mu,t:'miss',m:'Không có con số đích trong file'};
  if((m=/^(\d+(?:[.,]\d+)?)$/.exec(s))) return {target:num(m[1]),unit:mu,t:mu?'warn':'ok',m:mu?'Đơn vị lấy từ cột Chỉ số: «'+metric+'»':''};
  if((m=/^(\d+(?:[.,]\d+)?)\s*([^\d\/;,≥≤<>%=]+)$/.exec(s))) return {target:num(m[1]),unit:m[2].trim(),t:'ok',m:''};
  const nums=(s.match(/\d+(?:[.,]\d+)?/g)||[]).length;
  if(/[;≥≤<>]/.test(s)||nums>3) return {target:'',unit:'',t:'miss',m:'Thành công ghi «'+orig+'»: có nhiều con số, cần chọn một con số làm đích'};
  if((m=/^(\d+(?:[.,]\d+)?)\s*\/\s*(\d+(?:[.,]\d+)?)\s*([^\d]*)$/.exec(s))) return {target:num(m[1]),unit:(m[3].trim()||mu),t:'warn',m:'Đọc «'+orig+'» thành đích '+fmt(num(m[1]))+(m[3].trim()||mu?' '+(m[3].trim()||mu):'')};
  if((m=/^(\d+(?:[.,]\d+)?)\s*([^\d\/;,]+?)\s+(.*\d.*)$/.exec(s))) return {target:num(m[1]),unit:m[2].trim(),t:'warn',m:'Đọc «'+orig+'» thành đích '+fmt(num(m[1]))+' '+m[2].trim()+'; phần «'+m[3]+'» chưa dùng'};
  return {target:'',unit:mu,t:'miss',m:'Không đọc được con số đích từ «'+orig+'»'};
}
function guessRhythm(name){   // trả {rhythm,quota,slots,t,m}
  const s=String(name||'').toLowerCase(); let m;
  if(/sáng\s*,?\s*trưa\s*,?\s*(và\s*)?tối/.test(s)) return {rhythm:'multi',quota:1,slots:'Sáng, Trưa, Tối',t:'ok',m:''};
  if((m=/(\d+)\s*lần\s*(mỗi|một|\/)\s*tuần|mỗi tuần\s*(\d+)\s*lần/.exec(s))) return {rhythm:'weekly',quota:+(m[1]||m[3]),slots:'',t:'ok',m:''};
  if(/mỗi ngày|hằng ngày|hàng ngày|của ngày|mỗi sáng|mỗi tối|mỗi đêm/.test(s)) return {rhythm:'daily',quota:1,slots:'',t:'ok',m:''};
  if(/mỗi tuần|hằng tuần|hàng tuần/.test(s)){ const q=(m=/mỗi tuần\D*?(\d+)/.exec(s))?+m[1]:1; return {rhythm:'weekly',quota:q,slots:'',t:'warn',m:'Nhịp đoán là mỗi tuần '+q+' lần, từ câu «'+name+'»'}; }
  if(/sau mỗi|mỗi khi/.test(s)) return {rhythm:'event',quota:1,slots:'',t:'ok',m:''};
  if(/mỗi lần|^khi /.test(s)) return {rhythm:'event',quota:1,slots:'',t:'warn',m:'Nhịp đoán là theo sự kiện, từ câu «'+name+'»'};
  return {rhythm:'daily',quota:1,slots:'',t:'warn',m:'Câu KA không nói rõ nhịp: tạm để mỗi ngày'};
}
function parseSource(v){ const s=nrm(v); if(!s) return 0; let m=/^(?:nguon |n ?)?([1-6])(?:\b|$)/.exec(s); if(m) return +m[1];

const kaCodeIn=v=>{ const m=/^\s*(KA\s*\d+\.\d+\.\d+)/i.exec(String(v||'')); return m?codeLv(m[1]):null; };

  if(!/m[oộ]t l[aầ]n/i.test(String(freq||''))) return ''; const s=String(at||''); let m;
  if((m=/h[aạ]n\s*(\d{1,2}\/\d{1,2}(?:\/\d{4})?)/i.exec(s))) return oneDate(m[1],y);
  if((m=/(\d{1,2}(?:\/\d{1,2})?)\s*[–—-]\s*(\d{1,2}\/\d{1,2}(?:\/\d{4})?)/.exec(s))) return oneDate(m[2],y);
  if((m=/(\d{1,2}\/\d{1,2}(?:\/\d{4})?)/.exec(s))) return oneDate(m[1],y);

}
const parseStatus=v=>{ const s=nrm(v); return /xong|hoan thanh|done/.test(s)?'done':/chan|block/.test(s)?'blocked':'pending'; };

  const items=[],idx={},flag=(it,k,t,m)=>{ it.fl[k]={t,m}; },mk=(lv,code,where)=>({lv,code,where,f:{},src:{},fl:{},pi:null,pdb:'',ex:null});

    set(it,'kind',/danh s[aá]ch|t[ií]ch/i.test(o.kind||'')?'list':'sum',o.kind?'file':'def');
    const tg=o.unit&&/^\d/.test(o.success||'')?{target:num(o.success),unit:o.unit,t:'ok',m:''}:parseTarget(o.success,o.metric);

function dbByCode(lv,code){ const t=LV[lv].t; return DB[t].filter(r=>r.code===code&&(lv!=='O'?true:r.status!=='archived')).filter(r=>{ const pid=lv==='O'?r.id:lv==='KR'?r.pid:lv==='KA'?bPid(r):aPid(r),p=P(pid); return p&&p.status!=='archived'&&!p.closed_at; }).sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt))); }

}
function impMatch(it,items){   // tìm bản ghi đã có để cập nhật thay vì tạo trùng
  it.ex=null; if(it.fl._p&&it.fl._p.t==='miss') return;
  const t=LV[it.lv].t,par=it.pi!==null?(items[it.pi].ex&&items[it.pi].ex.id):it.pdb;
  if(it.lv==='O'){ const cs=DB.projects.filter(p=>p.code===it.code); it.ex=cs.find(p=>{ const s=it.f.start_date,e=it.f.end_date; return s&&e&&p.start_date&&p.end_date?(p.start_date<=e&&s<=p.end_date):nrm(p.name)===nrm(it.f.name); })||null; return; }

function impApply(){

  const merge=(it,base,keys)=>{ const r=Object.assign({},base); keys.forEach(k=>{ const v=it.f[k]; if(v===undefined||v==='') return; const s=it.src[k]; if(!it.ex||s==='file'||s==='user'||r[k]===undefined||r[k]===''||r[k]===null) r[k]=val(it,k); }); return r; };
  its.forEach((it,i)=>{
    if(impBlocked(it,its)){ const why=Object.values(it.fl).filter(x=>x.t==='miss').map(x=>x.m).join('; ')||'dòng cha bị bỏ qua'; rep.skip.push((it.code||'Hành động')+' · '+(it.f.name||'(chưa có tên)')+': '+why); return; }

    if(it.lv==='KR'){ rec=merge(it,it.ex||{id:uid('g'),weight:0,link_mode:'count',link_bid:''},['name','why','kind','target','unit','measure','measure_when','confirmer','start_date','deadline']); rec.code=it.code; rec.pid=par; put('goals',rec); }
    if(it.lv==='KA'){ rec=merge(it,it.ex||{id:uid('b'),created:td(),habit:false,rest:''},['name','desc','rhythm','quota','slots','m1','m2','m3']); rec.code=it.code; rec.gid=par; rec.pid=''; if(!it.ex){ const g=G(par),gs=g?gStart(g):''; rec.start_date=gs&&gs>td()?gs:td(); } if(rec.rhythm!=='weekly') rec.quota=1; if(rec.rhythm!=='multi') rec.slots=''; put('behaviors',rec); }
    if(it.lv==='HD'){ rec=merge(it,it.ex||{id:uid('a'),status:'pending'},['name','source','assignee','deadline','status','note']); if(it.code) rec.code=it.code; rec.bid=par; rec.pid=''; put('actions',rec); }
    ids[i]=rec.id; (it.ex?rep.u:rep.n)[it.lv]++;
    Object.keys(it.fl).filter(k=>it.fl[k].t==='warn').forEach(k=>rep.guess.push((it.code||'Hành động')+' · '+it.fl[k].m));
  });
  its.forEach((it,i)=>{ if(it.lv==='KR'&&ids[i]){ const g=G(ids[i]); if(g&&g.kind==='ka'&&!B(g.link_bid)){ const k=its.findIndex((x,j)=>x.lv==='KA'&&x.pi===i&&ids[j]); if(k>-1) put('goals',Object.assign({},g,{link_bid:ids[k]})); } } });
  newO.forEach(id=>{ if(!UI.pids.includes(id)) UI.pids.push(id); }); fixUI(); IMP=null; commit();
  const line=o=>['O','KR','KA','HD'].filter(k=>o[k]).map(k=>o[k]+' '+LV[k].l).join(' · ')||'0';
  oMod('✅ Đã nhập','<div class="ni"><div><b>Mới:</b> '+line(rep.n)+'</div><div><b>Cập nhật:</b> '+line(rep.u)+'</div><div class="ovs">Số liệu, lần ghi nhận đã có giữ nguyên.</div></div>'+(rep.skip.length?'<div class="sl" style="margin:16px 0 8px;color:var(--er)">⏭ Bỏ qua, cần nhập tay ('+rep.skip.length+')</div><div class="imlist" id="imp-skip">'+rep.skip.map(x=>'<div>• '+esc(x)+'</div>').join('')+'</div>':'')+(rep.guess.length?'<div class="sl" style="margin:16px 0 8px;color:var(--wa)">🟡 Đã nhập theo đoán, nên xem lại ('+rep.guess.length+')</div><div class="imlist" id="imp-guess">'+rep.guess.map(x=>'<div>• '+esc(x)+'</div>').join('')+'</div>':''),null,null);
}

const setOf=p=>String((p&&p.role)||'').trim()||'Chưa có vai trò';
const SETC=['#FFD400','#3fe0c5','#ff8fab','#79b8ff','#c39bff','#ffb347','#9be15d'];
function setColors(){   // mỗi bộ một màu, không trùng nhau, giữ nguyên giữa các máy
  const names=[...new Set(DB.projects.map(setOf))].sort((a,b)=>a.localeCompare(b,'vi')),used=new Set(),m={};
  names.forEach(n=>{ let h=0; for(const ch of n) h=(h*31+ch.codePointAt(0))>>>0; let i=h%SETC.length,k=0; while(used.has(i)&&k<SETC.length){ i=(i+1)%SETC.length; k++; } used.add(i); m[n]=SETC[i]; });
  return m;
}
const setCol=n=>setColors()[n]||SETC[0];
const oKey=p=>p.code?String(p.code):'~'+(p.created||'')+p.name;
function sets(){   // các bộ OKR đang chạy (theo vai trò), mỗi bộ gồm các O cùng vai trò
  const m=new Map(),cm=setColors(); actP().forEach(p=>{ const n=setOf(p); if(!m.has(n)) m.set(n,[]); m.get(n).push(p); });
  const cmp=(a,b)=>oKey(a).localeCompare(oKey(b),undefined,{numeric:true});
  return [...m].map(([n,ps])=>({n,c:cm[n]||SETC[0],ps:ps.sort(cmp)})).sort((a,b)=>cmp(a.ps[0],b.ps[0])||a.n.localeCompare(b.n,'vi'));
}

          if(b.rhythm!=='event') L.push('    7 ngày: '+last7(b).map(x=>WD[pd(x.d).getDay()]+' '+(x.c==='on'?'✓':x.c==='pt'?'½':x.c==='rs'?'nghỉ':'·')).join(' | '));
          L.push('    6 nguồn: '+cv.filter(x=>x.n>0).length+'/6 có hành động'+(cv.some(x=>!x.n)?' · còn trống: '+cv.filter(x=>!x.n).map(x=>x.s.id+' '+x.s.s).join(', '):''));
          DB.actions.filter(a=>a.bid===b.id).sort((a,c)=>a.source-c.source).forEach(a=>{ const sr=SRC[a.source-1]; L.push('    - [N'+sr.id+' '+sr.s+' · '+ST[a.status].l+'] '+a.name+(a.assignee?' · '+a.assignee:'')+(a.deadline?' · hạn '+fd(a.deadline):'')+(a.note?' · '+a.note:'')); });
        });
      });
      L.push('');
    });
  });
  const rs=reviews(); if(rs.length){ L.push('## RÀ SOÁT TUẦN ('+rs.length+' tuần, mới nhất trước)',''); rs.forEach(r=>{ L.push(txt(rvFull(r)),''); }); }
  const cl=DB.projects.filter(isClosed); if(cl.length){ L.push('## CHỐT CHU KỲ',''); cl.forEach(p=>{ L.push('### '+p.name+' · '+(p.cycle||'')+' · tự chấm '+fmt(oFinal(p))+' ('+(passed(p,oFinal(p))?'đạt':'chưa đạt')+')'); [['Câu chuyện sau con số',p.story],['6 nguồn',p.src_note],['Bài học',p.lessons]].forEach(x=>{ if(String(x[1]||'').trim()) L.push(x[0]+': '+x[1]); }); L.push(''); }); }
  return L.join('\n');
}
let repT=null,repLast='';
function repSoon(){ if(AUTH.ro||AUTH.local||!AUTH.url||!AUTH.pwd) return; clearTimeout(repT); repT=setTimeout(repSend,4000); }
function repDaily(){ if(LS.get('gah2_rep_day','')!==td()) repSoon(); }
async function repSend(){
  if(AUTH.ro||AUTH.local||!AUTH.pwd) return; const text=reportText(),k=text.replace(/^Cập nhật:.*$/m,'');
  if(k===repLast&&LS.get('gah2_rep_day','')===td()) return;
  try{ const r=await api({action:'report',text}); if(r&&r.ok){ repLast=k; LS.set('gah2_rep_day',td()); } }catch(e){}
}

boot();
</script>
